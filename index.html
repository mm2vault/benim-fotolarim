<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>👨‍👩‍👧‍👦 Aile Galerisi</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(ellipse at 50% 0%, #1a2332 0%, #0b0e14 70%);
        }

        .app {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            background: rgba(18, 26, 38, 0.88);
            backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(240, 147, 62, 0.08), rgba(230, 126, 34, 0.04));
            border-radius: 20px;
            border: 1px solid rgba(240, 147, 62, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            height: 44px;
            width: auto;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0e6d0, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-badge {
            background: linear-gradient(135deg, rgba(240, 147, 62, 0.15), rgba(230, 126, 34, 0.05));
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: #f0933e;
            border: 1px solid rgba(240, 147, 62, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-badge .cikis-btn {
            background: rgba(248, 81, 73, 0.08);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.1);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
        }

        .header-badge .cikis-btn:hover {
            background: rgba(248, 81, 73, 0.16);
        }

        .status {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #7a879f;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: #f0933e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .status.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== GİRİŞ EKRANI ===== */
        .giris-ekrani {
            margin-top: 30px;
            padding: 40px 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .giris-ekrani .avatar {
            font-size: 72px;
            display: block;
            margin-bottom: 12px;
        }

        .giris-ekrani .baslik {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .giris-ekrani .alt-baslik {
            color: #6b7a93;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .giris-ekrani .telefon-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #e8edf5;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
            text-align: center;
            margin-bottom: 12px;
        }

        .giris-ekrani .telefon-input:focus {
            border-color: #f0933e;
            box-shadow: 0 0 0 4px rgba(240, 147, 62, 0.08);
        }

        .giris-ekrani .kod-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #e8edf5;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 12px;
            display: none;
        }

        .giris-ekrani .kod-input:focus {
            border-color: #f0933e;
            box-shadow: 0 0 0 4px rgba(240, 147, 62, 0.08);
        }

        .giris-ekrani .btn-giris {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
        }

        .giris-ekrani .btn-giris:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(240, 147, 62, 0.3);
        }

        .giris-ekrani .btn-kod-gonder {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #e8edf5;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .giris-ekrani .btn-kod-gonder:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .giris-ekrani .hata {
            color: #f85149;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .giris-ekrani .hata.goster {
            display: block;
        }

        .giris-ekrani .kullanici-bilgi {
            color: #4a5268;
            font-size: 13px;
            margin-top: 12px;
        }

        .giris-ekrani .geri-link {
            color: #6b7a93;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }

        .giris-ekrani .geri-link:hover {
            color: #e8edf5;
        }

        /* ===== REPO GRİD ===== */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .repo-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            padding: 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s;
            cursor: pointer;
            text-align: center;
        }

        .repo-card:hover {
            border-color: rgba(240, 147, 62, 0.25);
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .repo-card .repo-avatar {
            font-size: 32px;
            display: block;
            margin-bottom: 6px;
        }

        .repo-card .repo-isim {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .repo-card .repo-ad {
            font-size: 12px;
            color: #6b7a93;
        }

        .gizli {
            display: none !important;
        }

        .btn-geri {
            background: rgba(255, 255, 255, 0.05);
            color: #e8edf5;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.25s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .btn-geri:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== DOSYA ALANI ===== */
        .file-area {
            border: 2px dashed rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 30px 20px 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.4s;
            background: rgba(255, 255, 255, 0.01);
            margin-bottom: 18px;
            position: relative;
        }

        .file-area:hover {
            border-color: rgba(240, 147, 62, 0.3);
            background: rgba(255, 255, 255, 0.03);
        }

        .file-area.dragover {
            border-color: #f0933e;
            background: rgba(240, 147, 62, 0.05);
        }

        .file-area .icon {
            display: block;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .file-area .text {
            font-size: 15px;
            color: #7a879f;
        }

        .file-area .text strong {
            color: #e8edf5;
            font-weight: 500;
        }

        .file-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-area .file-count {
            display: inline-block;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: #5a687e;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 0.7fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-upload {
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            box-shadow: 0 4px 20px rgba(240, 147, 62, 0.25);
        }

        .btn-upload:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(240, 147, 62, 0.35);
        }

        .btn-upload:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-list {
            background: rgba(255, 255, 255, 0.05);
            color: #e8edf5;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-list:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-clear {
            background: rgba(248, 81, 73, 0.08);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.1);
        }

        .btn-clear:hover {
            background: rgba(248, 81, 73, 0.16);
            transform: translateY(-2px);
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 2px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .gallery-header .left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #6b7a93;
            font-weight: 500;
            flex-wrap: wrap;
        }

        .gallery-header .count {
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        .gallery-stats {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: #7a879f;
        }

        .gallery-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding-top: 2px;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #3e485a;
            padding: 48px 0 32px;
            font-size: 15px;
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.4s;
            cursor: pointer;
        }

        .gallery-item:hover {
            border-color: rgba(240, 147, 62, 0.25);
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .gallery-item .media {
            width: 100%;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e14;
            overflow: hidden;
            position: relative;
        }

        .gallery-item .media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
            display: block;
        }

        .gallery-item:hover .media img {
            transform: scale(1.05);
        }

        .gallery-item .media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .gallery-item .info {
            padding: 10px 14px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .gallery-item .info .name {
            font-size: 12px;
            color: #6b7a93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .gallery-item .info .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .gallery-item .info .actions button {
            background: none;
            border: none;
            color: #4a5268;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 8px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .gallery-item .info .actions .download-btn {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #b8c4d4;
            font-weight: 500;
        }

        .gallery-item .info .actions .download-btn:hover {
            background: #f0933e;
            color: #fff;
        }

        .gallery-item .info .actions .delete-btn:hover {
            color: #f85149;
            background: rgba(248, 81, 73, 0.08);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(20px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 94vw;
            max-height: 92vh;
            border-radius: 20px;
            position: relative;
            background: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .modal-content img,
        .modal-content video {
            max-width: 94vw;
            max-height: 85vh;
            display: block;
            object-fit: contain;
            border-radius: 16px;
        }

        .modal-content video {
            background: #000;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            font-size: 22px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .modal-bottom {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            padding: 10px 18px 10px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 90%;
            z-index: 5;
        }

        .modal-filename {
            color: #9aabbf;
            font-size: 13px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-download {
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 9px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .modal-download:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 28px rgba(240, 147, 62, 0.4);
        }

        @media (max-width: 600px) {
            .app {
                padding: 18px;
            }
            .buttons {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header-badge {
                font-size: 10px;
                padding: 4px 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .header-logo {
                height: 34px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .gallery-item .media {
                height: 130px;
            }
            .repo-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .repo-card {
                padding: 16px 12px;
            }
            .giris-ekrani {
                padding: 20px 16px;
            }
            .giris-ekrani .avatar {
                font-size: 48px;
            }
            .modal-content {
                max-width: 98vw;
            }
            .modal-bottom {
                padding: 6px 12px 6px 16px;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                bottom: 14px;
            }
            .modal-filename {
                max-width: 80px;
                font-size: 12px;
            }
            .modal-download {
                padding: 6px 16px;
                font-size: 12px;
            }
            .modal-close {
                width: 34px;
                height: 34px;
                font-size: 18px;
                top: 10px;
                right: 12px;
            }
            .gallery-header {
                flex-direction: column;
                align-items: stretch;
            }
            .gallery-header .left {
                justify-content: center;
                flex-wrap: wrap;
            }
            .gallery-stats {
                font-size: 11px;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <img class="header-logo" src="https://i.postimg.cc/tCYfpbZy/be371099-de3c-430e-b3de-37d5dbd175fa.png" alt="Logo">
                <h1>👨‍👩‍👧‍👦 Aile Galerisi</h1>
            </div>
            <span class="header-badge">
                ✦ Aile Sistemi
                <button class="cikis-btn" id="cikisBtn">🚪 Çıkış Yap</button>
            </span>
        </div>

        <!-- DURUM -->
        <div class="status" id="status">
            <span class="spinner"></span>
            <span class="msg">✨ Hoş geldiniz</span>
        </div>

        <!-- GİRİŞ EKRANI -->
        <div id="girisEkrani" class="giris-ekrani">
            <span class="avatar">📱</span>
            <div class="baslik">Telefon ile Giriş</div>
            <div class="alt-bilgi" id="altBilgi">Telefon numaranı gir, doğrulama kodu gelecek</div>
            
            <input type="tel" class="telefon-input" id="telefonInput" placeholder="+90 5xx xxx xx xx">
            <input type="text" class="kod-input" id="kodInput" placeholder="6 haneli kodu gir">
            
            <button class="btn-kod-gonder" id="kodGonderBtn">📨 Kod Gönder</button>
            <button class="btn-giris" id="girisBtn" style="display:none;">🔓 Giriş Yap</button>
            
            <div class="geri-link" id="geriLink">← Geri</div>
            <div class="hata" id="girisHata">❌ Hata! Tekrar deneyin.</div>
            <div class="kullanici-bilgi" id="kullaniciBilgi"></div>
        </div>

        <!-- REPO SAYFASI -->
        <div id="repoSayfa" class="gizli">
            <button class="btn-geri" id="geriBtn">← Geri</button>
            <div class="repo-grid" id="repoGrid"></div>
        </div>

        <!-- GALERİ SAYFASI -->
        <div id="galeriSayfa" class="gizli">
            <button class="btn-geri" id="galeriGeriBtn">← Geri</button>

            <div class="file-area" id="fileArea">
                <span class="icon">
                    <img src="https://i.postimg.cc/TY1HR0Dk/e625067c-560b-4f86-a39c-725239da40f1-(1)(3).png" alt="Dosya" style="width:40px;height:40px;display:block;margin:0 auto;">
                </span>
                <div class="text">
                    <strong>Dosya seç</strong> veya buraya sürükle
                </div>
                <div class="file-count" id="fileCount">Hiç dosya seçilmedi</div>
                <input type="file" id="fileInput" multiple accept="image/*,video/*">
            </div>

            <div class="buttons">
                <button class="btn btn-upload" id="uploadBtn">📤 Yükle</button>
                <button class="btn btn-list" id="listBtn">📋 Listele</button>
                <button class="btn btn-clear" id="clearBtn">🗑️ Temizle</button>
            </div>

            <div class="gallery-header">
                <div class="left">
                    <span>📸 Galeri</span>
                    <span class="count" id="galleryCount">0 dosya</span>
                    <div class="gallery-stats">
                        <span>🖼️ <span id="imageCount">0</span></span>
                        <span>🎬 <span id="videoCount">0</span></span>
                    </div>
                </div>
            </div>

            <div class="gallery" id="gallery">
                <div class="gallery-empty">
                    <span style="font-size:48px;display:block;margin-bottom:8px;">📭</span>
                    Henüz fotoğraf yok
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">✕</button>
            <div id="modalMedia"></div>
            <div class="modal-bottom">
                <span class="modal-filename" id="modalFilename">dosya</span>
                <button class="modal-download" id="modalDownload">⬇️ İndir</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================
        // 🔥 FİREBASE KONFIGÜRASYONU
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAyPCMSYg14OLTtfgsta94XfU2yDaYee3Y",
            authDomain: "benim-fotolarim.firebaseapp.com",
            projectId: "benim-fotolarim",
            storageBucket: "benim-fotolarim.firebasestorage.app",
            messagingSenderId: "999858368144",
            appId: "1:999858368144:web:8fe8de0da97844d67d7215"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let windowRef = null;
        let confirmResult = null;

        // ==========================================================
        // TELEFON NUMARASI -> REPO EŞLEŞMESİ
        // ==========================================================
        const telefonRepolar = {
            '+994705990606': ['mm2-1', 'mm2-2'], // Sen
            '+994776367936': ['anne-1', 'anne-2'], // Anne
            '+994706367936': ['baba-1', 'baba-2'], // Baba
            '+994556367936': ['abla-1', 'abla-2'] // Abla
        };

        // ==========================================================
        // DOM
        // ==========================================================
        const statusEl = document.getElementById('status');
        const statusMsg = statusEl.querySelector('.msg');
        const girisEkrani = document.getElementById('girisEkrani');
        const repoSayfa = document.getElementById('repoSayfa');
        const galeriSayfa = document.getElementById('galeriSayfa');
        const geriBtn = document.getElementById('geriBtn');
        const galeriGeriBtn = document.getElementById('galeriGeriBtn');
        const cikisBtn = document.getElementById('cikisBtn');

        const telefonInput = document.getElementById('telefonInput');
        const kodInput = document.getElementById('kodInput');
        const kodGonderBtn = document.getElementById('kodGonderBtn');
        const girisBtn = document.getElementById('girisBtn');
        const geriLink = document.getElementById('geriLink');
        const girisHata = document.getElementById('girisHata');
        const altBilgi = document.getElementById('altBilgi');
        const kullaniciBilgi = document.getElementById('kullaniciBilgi');
        const repoGrid = document.getElementById('repoGrid');

        const fileInput = document.getElementById('fileInput');
        const fileArea = document.getElementById('fileArea');
        const fileCount = document.getElementById('fileCount');
        const galleryCount = document.getElementById('galleryCount');
        const imageCount = document.getElementById('imageCount');
        const videoCount = document.getElementById('videoCount');
        const uploadBtn = document.getElementById('uploadBtn');
        const listBtn = document.getElementById('listBtn');
        const clearBtn = document.getElementById('clearBtn');
        const gallery = document.getElementById('gallery');

        const modal = document.getElementById('modal');
        const modalMedia = document.getElementById('modalMedia');
        const modalFilename = document.getElementById('modalFilename');
        const modalClose = document.getElementById('modalClose');
        const modalDownload = document.getElementById('modalDownload');

        let currentModalUrl = '';
        let currentModalName = '';
        let aktifRepo = null;
        let currentUser = null;

        // ==========================================================
        // YARDIMCI
        // ==========================================================
        function setStatus(text, type = '') {
            statusEl.className = 'status' + (type ? ' ' + type : '');
            statusMsg.innerHTML = text;
        }

        function getConfig() {
            return {
                user: 'mm2vault',
                repo: aktifRepo,
                token: localStorage.getItem('githubToken') || ''
            };
        }

        function getFileList() { return Array.from(fileInput.files); }

        function updateFileCount() {
            const files = getFileList();
            fileCount.textContent = files.length === 0 ? 'Hiç dosya seçilmedi' : `${files.length} dosya seçildi`;
        }

        fileInput.addEventListener('change', updateFileCount);

        // ==========================================================
        // DRAG & DROP
        // ==========================================================
        fileArea.addEventListener('dragover', e => {
            e.preventDefault();
            fileArea.classList.add('dragover');
        });
        fileArea.addEventListener('dragleave', () => fileArea.classList.remove('dragover'));
        fileArea.addEventListener('drop', e => {
            e.preventDefault();
            fileArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileCount();
            }
        });

        // ==========================================================
        // 🔐 TELEFON İLE GİRİŞ
        // ==========================================================
        let isCodeSent = false;

        // Kod Gönder
        kodGonderBtn.addEventListener('click', () => {
            const phone = telefonInput.value.trim();
            if (!phone || phone.length < 10) {
                girisHata.textContent = '❌ Geçerli bir telefon numarası girin!';
                girisHata.classList.add('goster');
                return;
            }

            setStatus('⏳ Kod gönderiliyor...', 'loading');
            girisHata.classList.remove('goster');

            const appVerifier = new firebase.auth.RecaptchaVerifier('girisEkrani', {
                size: 'invisible',
                callback: () => {}
            });

            auth.signInWithPhoneNumber(phone, appVerifier)
                .then((confirmationResult) => {
                    confirmResult = confirmationResult;
                    isCodeSent = true;
                    kodInput.style.display = 'block';
                    girisBtn.style.display = 'block';
                    kodGonderBtn.style.display = 'none';
                    geriLink.style.display = 'block';
                    telefonInput.disabled = true;
                    altBilgi.textContent = '📨 Kod gönderildi! Telefonuna gelen 6 haneli kodu gir.';
                    setStatus('📨 Kod gönderildi', 'success');
                    kodInput.focus();
                })
                .catch((error) => {
                    console.error('Kod gönderme hatası:', error);
                    girisHata.textContent = '❌ Kod gönderilemedi: ' + error.message;
                    girisHata.classList.add('goster');
                    setStatus('❌ Kod gönderilemedi', 'error');
                });
        });

        // Kod Doğrula ve Giriş Yap
        girisBtn.addEventListener('click', () => {
            const code = kodInput.value.trim();
            if (!code || code.length < 6) {
                girisHata.textContent = '❌ 6 haneli kodu girin!';
                girisHata.classList.add('goster');
                return;
            }

            setStatus('⏳ Doğrulanıyor...', 'loading');
            girisHata.classList.remove('goster');

            confirmResult.confirm(code)
                .then((result) => {
                    const user = result.user;
                    currentUser = user;
                    const phone = user.phoneNumber;

                    girisHata.classList.remove('goster');
                    kullaniciBilgi.textContent = `✅ Hoş geldin! (${phone})`;
                    setStatus(`✅ ${phone} ile giriş yapıldı`, 'success');

                    const repolar = telefonRepolar[phone];
                    if (repolar) {
                        repoGoster(repolar, phone);
                    } else {
                        girisHata.textContent = '⚠️ Bu numara için kayıtlı repo bulunamadı!';
                        girisHata.classList.add('goster');
                        setStatus('⚠️ Repo bulunamadı', 'error');
                        setTimeout(() => {
                            auth.signOut();
                        }, 3000);
                    }
                })
                .catch((error) => {
                    console.error('Doğrulama hatası:', error);
                    girisHata.textContent = '❌ Kod yanlış! Tekrar deneyin.';
                    girisHata.classList.add('goster');
                    kodInput.value = '';
                    kodInput.focus();
                    setStatus('❌ Kod yanlış', 'error');
                });
        });

        // Geri (numara değiştir)
        geriLink.addEventListener('click', () => {
            isCodeSent = false;
            confirmResult = null;
            kodInput.style.display = 'none';
            girisBtn.style.display = 'none';
            kodGonderBtn.style.display = 'block';
            geriLink.style.display = 'none';
            telefonInput.disabled = false;
            kodInput.value = '';
            altBilgi.textContent = 'Telefon numaranı gir, doğrulama kodu gelecek';
            girisHata.classList.remove('goster');
            setStatus('✨ Numara girin', '');
        });

        // Enter tuşu
        kodInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && isCodeSent) girisBtn.click();
        });
        telefonInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') kodGonderBtn.click();
        });

        // ==========================================================
        // REPOLARI GÖSTER
        // ==========================================================
        function repoGoster(repolar, phone) {
            girisEkrani.classList.add('gizli');
            repoSayfa.classList.remove('gizli');
            galeriSayfa.classList.add('gizli');
            repoGrid.innerHTML = '';

            for (const repoAdi of repolar) {
                const kart = document.createElement('div');
                kart.className = 'repo-card';
                kart.innerHTML = `
                    <span class="repo-avatar">📁</span>
                    <div class="repo-isim">${phone} - ${repoAdi}</div>
                    <div class="repo-ad">${repoAdi}</div>
                `;
                kart.addEventListener('click', () => {
                    aktifRepo = repoAdi;
                    galeriAc(repoAdi);
                });
                repoGrid.appendChild(kart);
            }

            setStatus(`📂 ${phone} - Repolar`, '');
        }

        // ==========================================================
        // GALERİ AÇ
        // ==========================================================
        function galeriAc(repoAdi) {
            repoSayfa.classList.add('gizli');
            galeriSayfa.classList.remove('gizli');
            setStatus(`📂 ${repoAdi}`, '');
            listFiles();
        }

        // ==========================================================
        // GERİ BUTONU
        // ==========================================================
        function repodanGiriseDon() {
            auth.signOut().then(() => {
                currentUser = null;
                repoSayfa.classList.add('gizli');
                girisEkrani.classList.remove('gizli');
                kullaniciBilgi.textContent = '';
                girisHata.classList.remove('goster');
                telefonInput.disabled = false;
                kodInput.style.display = 'none';
                girisBtn.style.display = 'none';
                kodGonderBtn.style.display = 'block';
                geriLink.style.display = 'none';
                altBilgi.textContent = 'Telefon numaranı gir, doğrulama kodu gelecek';
                setStatus('🔐 Çıkış yapıldı', '');
            }).catch((error) => {
                console.error('Çıkış hatası:', error);
            });
        }

        geriBtn.addEventListener('click', repodanGiriseDon);

        // ==========================================================
        // GALERİDEN GERİ
        // ==========================================================
        function galeridenRepolaraDon() {
            galeriSayfa.classList.add('gizli');
            repoSayfa.classList.remove('gizli');
            if (currentUser) {
                const phone = currentUser.phoneNumber;
                const repolar = telefonRepolar[phone];
                if (repolar) {
                    repoGoster(repolar, phone);
                }
            }
            gallery.innerHTML = '';
            galleryCount.textContent = '0 dosya';
            imageCount.textContent = '0';
            videoCount.textContent = '0';
        }

        galeriGeriBtn.addEventListener('click', galeridenRepolaraDon);

        // ==========================================================
        // ÇIKIŞ YAP
        // ==========================================================
        function cikisYap() {
            if (!confirm('Çıkış yapmak istediğine emin misin?')) return;

            auth.signOut().then(() => {
                currentUser = null;
                repoSayfa.classList.add('gizli');
                galeriSayfa.classList.add('gizli');
                girisEkrani.classList.remove('gizli');
                kullaniciBilgi.textContent = '';
                girisHata.classList.remove('goster');
                telefonInput.disabled = false;
                kodInput.style.display = 'none';
                girisBtn.style.display = 'none';
                kodGonderBtn.style.display = 'block';
                geriLink.style.display = 'none';
                altBilgi.textContent = 'Telefon numaranı gir, doğrulama kodu gelecek';
                setStatus('🚪 Çıkış yapıldı', '');
            }).catch((error) => {
                console.error('Çıkış hatası:', error);
            });
        }

        cikisBtn.addEventListener('click', cikisYap);

        // ==========================================================
        // LİSTELEME
        // ==========================================================
        async function listFiles() {
            const cfg = getConfig();
            if (!cfg.token || !cfg.repo) {
                setStatus('❌ GitHub token gerekli!', 'error');
                return;
            }

            setStatus('⏳ Yükleniyor...', 'loading');
            gallery.innerHTML = '';

            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });

                if (res.status === 404) {
                    setStatus('📭 Klasör boş', '');
                    gallery.innerHTML =
                        `<div class="gallery-empty"><span style="font-size:48px;display:block;margin-bottom:8px;">📭</span>Henüz fotoğraf yok</div>`;
                    galleryCount.textContent = '0 dosya';
                    imageCount.textContent = '0';
                    videoCount.textContent = '0';
                    return;
                }

                if (!res.ok) {
                    const err = await res.json();
                    setStatus(`❌ ${err.message || 'Hata'}`, 'error');
                    return;
                }

                const data = await res.json();
                if (!data || !data.length) {
                    setStatus('📭 Boş', '');
                    gallery.innerHTML =
                        `<div class="gallery-empty"><span style="font-size:48px;display:block;margin-bottom:8px;">📭</span>Henüz fotoğraf yok</div>`;
                    galleryCount.textContent = '0 dosya';
                    imageCount.textContent = '0';
                    videoCount.textContent = '0';
                    return;
                }

                let imgSay = 0,
                    vidSay = 0;
                data.forEach(item => {
                    if (/\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name)) vidSay++;
                    else if (/\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name)) imgSay++;
                });
                imageCount.textContent = imgSay;
                videoCount.textContent = vidSay;

                setStatus(`📸 ${data.length} dosya bulundu`, 'success');
                galleryCount.textContent = `${data.length} dosya`;

                const fragment = document.createDocumentFragment();
                data.sort((a, b) => a.name.localeCompare(b.name)).reverse();

                for (const item of data) {
                    const rawUrl =
                        `https://raw.githubusercontent.com/${cfg.user}/${cfg.repo}/main/fotolar/${encodeURIComponent(item.name)}`;
                    const isVideo = /\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name);
                    const isImage = /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name);

                    const div = document.createElement('div');
                    div.className = 'gallery-item';

                    let mediaHtml = '';
                    if (isVideo) {
                        mediaHtml =
                            `<div class="media" onclick="openModal('${rawUrl}','${item.name}',true)"><video src="${rawUrl}" preload="metadata" playsinline muted></video></div>`;
                    } else if (isImage) {
                        mediaHtml =
                            `<div class="media" onclick="openModal('${rawUrl}','${item.name}',false)"><img src="${rawUrl}" loading="lazy" onerror="this.parentElement.innerHTML='<span style=color:#4a5268;font-size:20px;>⚠️</span>'"></div>`;
                    } else {
                        mediaHtml =
                            `<div class="media" style="color:#4a5268;font-size:13px;text-align:center;padding:10px;">📄 ${item.name}</div>`;
                    }

                    div.innerHTML = `
                        ${mediaHtml}
                        <div class="info">
                            <span class="name" title="${item.name}">${item.name}</span>
                            <div class="actions">
                                <button class="download-btn" onclick="downloadFile('${rawUrl}','${item.name}')">⬇️ İndir</button>
                                <button class="delete-btn" onclick="deleteFile('${item.name}','${item.sha}')">🗑️</button>
                            </div>
                        </div>
                    `;
                    fragment.appendChild(div);
                }
                gallery.appendChild(fragment);

            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
            }
        }

        listBtn.addEventListener('click', listFiles);

        // ==========================================================
        // MODAL
        // ==========================================================
        function openModal(url, name, isVideo) {
            currentModalUrl = url;
            currentModalName = name;
            modalFilename.textContent = name;
            modal.classList.add('active');

            if (isVideo) {
                modalMedia.innerHTML =
                    `<video src="${url}" controls autoplay style="max-width:94vw;max-height:85vh;border-radius:16px;background:#000;"></video>`;
            } else {
                modalMedia.innerHTML =
                    `<img src="${url}" alt="Fotoğraf" style="max-width:94vw;max-height:85vh;border-radius:16px;">`;
            }
        }

        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
            modalMedia.innerHTML = '';
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                modalMedia.innerHTML = '';
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modal.classList.remove('active');
                modalMedia.innerHTML = '';
            }
        });

        // ==========================================================
        // İNDİRME
        // ==========================================================
        function downloadFile(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        modalDownload.addEventListener('click', () => {
            if (currentModalUrl) downloadFile(currentModalUrl, currentModalName);
        });

        // ==========================================================
        // YÜKLEME
        // ==========================================================
        async function uploadFiles() {
            const cfg = getConfig();
            if (!cfg.token || !cfg.repo) {
                setStatus('❌ GitHub token gerekli!', 'error');
                return;
            }

            const files = getFileList();
            if (!files.length) {
                setStatus('⚠️ Lütfen dosya seç', 'error');
                return;
            }

            uploadBtn.disabled = true;
            let success = 0,
                failed = 0;

            for (const file of files) {
                setStatus(`⏳ ${file.name} (${success + failed + 1}/${files.length})`, 'loading');
                try {
                    const base64 = await toBase64(file);
                    const url =
                        `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(file.name)}`;
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Yükle: ${file.name}`,
                            content: base64
                        })
                    });
                    if (res.ok) success++;
                    else failed++;
                } catch { failed++; }
            }

            uploadBtn.disabled = false;

            if (failed === 0 && success > 0) {
                setStatus(`✅ ${success} dosya yüklendi`, 'success');
                fileInput.value = '';
                updateFileCount();
                setTimeout(listFiles, 2000);
            } else if (success > 0) {
                setStatus(`⚠️ ${success} başarılı, ${failed} hata`, 'error');
                setTimeout(listFiles, 2000);
            } else {
                setStatus('❌ Hiçbir dosya yüklenemedi', 'error');
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        uploadBtn.addEventListener('click', uploadFiles);

        // ==========================================================
        // SİLME
        // ==========================================================
        async function deleteFile(filename, sha) {
            if (!confirm(`"${filename}" kalıcı olarak silinsin mi?`)) return;
            const cfg = getConfig();
            if (!cfg.token || !cfg.repo) return;

            setStatus(`⏳ Siliniyor: ${filename}`, 'loading');
            try {
                const url =
                    `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(filename)}`;
                const res = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: `Sil: ${filename}`, sha: sha })
                });

                if (res.ok) {
                    setStatus(`🗑️ "${filename}" silindi`, 'success');
                    setTimeout(listFiles, 2000);
                } else {
                    const err = await res.json();
                    setStatus(`❌ Silinemedi: ${err.message || 'Hata'}`, 'error');
                }
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
            }
        }

        // ==========================================================
        // TÜMÜNÜ TEMİZLE
        // ==========================================================
        async function clearAll() {
            const cfg = getConfig();
            if (!cfg.token || !cfg.repo) return;
            if (!confirm('⚠️ TÜM dosyalar silinecek! Devam et?')) return;

            setStatus('⏳ Temizleniyor...', 'loading');
            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (!res.ok) { setStatus('❌ Liste alınamadı', 'error'); return; }
                const data = await res.json();
                if (!data.length) { setStatus('📭 Zaten boş', ''); return; }

                let deleted = 0;
                for (const item of data) {
                    const del = await fetch(`${url}/${encodeURIComponent(item.name)}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: `Toplu sil`, sha: item.sha })
                    });
                    if (del.ok) deleted++;
                }
                setStatus(`🗑️ ${deleted} dosya silindi`, 'success');
                setTimeout(listFiles, 2000);
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
            }
        }

        clearBtn.addEventListener('click', clearAll);

        // ==========================================================
        // OTURUM KONTROLÜ
        // ==========================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                const phone = user.phoneNumber;
                const repolar = telefonRepolar[phone];
                if (repolar) {
                    girisEkrani.classList.add('gizli');
                    repoGoster(repolar, phone);
                    setStatus(`✅ ${phone} ile giriş yapıldı`, 'success');
                } else {
                    auth.signOut();
                    setStatus('⚠️ Bu numara için kayıtlı repo bulunamadı', 'error');
                }
            } else {
                girisEkrani.classList.remove('gizli');
                repoSayfa.classList.add('gizli');
                galeriSayfa.classList.add('gizli');
                setStatus('✨ Lütfen giriş yapın', '');
            }
        });

        // ==========================================================
        // BAŞLANGIÇ
        // ==========================================================
        setStatus('✨ Aile sistemine hoş geldiniz', '');

        // GitHub token kontrolü
        const kayitliToken = localStorage.getItem('githubToken');
        if (!kayitliToken) {
            setStatus('⚠️ GitHub token gerekli! Lütfen gir.', 'error');
        }
    </script>

</body>
</html>
