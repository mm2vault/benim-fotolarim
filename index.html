<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📸 Aile Galerisi</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/tCYfpbZy/be371099-de3c-430e-b3de-37d5dbd175fa.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            padding: 12px;
            background-image: radial-gradient(ellipse at 50% 0%, #1a2332 0%, #0b0e14 70%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            background: rgba(18, 26, 38, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(240, 147, 62, 0.08), rgba(230, 126, 34, 0.04));
            border-radius: 18px;
            border: 1px solid rgba(240, 147, 62, 0.1);
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            height: 36px;
            width: auto;
            border-radius: 10px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0e6d0, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-badge {
            background: linear-gradient(135deg, rgba(240, 147, 62, 0.15), rgba(230, 126, 34, 0.05));
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            color: #f0933e;
            border: 1px solid rgba(240, 147, 62, 0.15);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 10px;
            font-weight: 600;
            color: #8892a8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            color: #e8edf5;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
            width: 100%;
            -webkit-appearance: none;
        }

        .input-group input:focus {
            border-color: #f0933e;
            box-shadow: 0 0 0 4px rgba(240, 147, 62, 0.08);
            background: rgba(255, 255, 255, 0.06);
        }

        .input-group input::placeholder {
            color: #3e485a;
        }

        .status {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 10px 16px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #7a879f;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: #f0933e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
            flex-shrink: 0;
        }

        .status.loading .spinner {
            display: block;
        }
        .status.success {
            border-color: rgba(46, 160, 67, 0.2);
            color: #4cda6c;
        }
        .status.error {
            border-color: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== TOAST BİLDİRİM ===== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            max-width: 92%;
            width: 400px;
        }

        .toast {
            pointer-events: auto;
            background: rgba(22, 30, 44, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 18px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 200px;
            width: 100%;
            animation: toastIn 0.35s ease both;
            transition: 0.3s;
        }

        .toast.hide {
            animation: toastOut 0.35s ease both;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-10px) scale(0.96); }
        }

        .toast .icon { font-size: 20px; flex-shrink: 0; line-height: 1; }
        .toast .content { flex: 1; font-size: 13px; color: #e8edf5; font-weight: 500; line-height: 1.4; }
        .toast .content .sub { font-size: 11px; color: #6b7a93; font-weight: 400; display: block; margin-top: 2px; }
        .toast .close-btn { background: none; border: none; color: #4a5268; font-size: 16px; cursor: pointer; padding: 0 4px; transition: 0.2s; min-width: 24px; min-height: 24px; }
        .toast .close-btn:hover { color: #e8edf5; }
        .toast.success { border-left: 3px solid #4cda6c; }
        .toast.error { border-left: 3px solid #f85149; }
        .toast.warning { border-left: 3px solid #f0933e; }
        .toast.info { border-left: 3px solid #58a6ff; }

        /* ===== KİŞİ KARTLARI ===== */
        .kisi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .kisi-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 20px 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .kisi-card:active {
            transform: scale(0.96);
            border-color: rgba(240, 147, 62, 0.3);
        }

        .kisi-card .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 10px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }

        .kisi-card .isim {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .kisi-card .kisi-stats {
            font-size: 12px;
            color: #6b7a93;
            margin-top: 4px;
        }

        .kisi-card .kisi-stats span {
            display: inline-block;
            margin: 0 3px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
            background: linear-gradient(90deg, #4cda6c, #f0933e, #f85149);
        }

        .kisi-card .kilit {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 12px;
            opacity: 0.5;
        }

        /* ===== REPO GRİD ===== */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .repo-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 16px 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .repo-card:active {
            transform: scale(0.96);
            border-color: rgba(240, 147, 62, 0.25);
        }

        .repo-card .repo-avatar {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .repo-card .repo-isim {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .repo-card .repo-ad {
            font-size: 11px;
            color: #6b7a93;
        }

        .gizli {
            display: none !important;
        }

        .btn-geri {
            background: rgba(255, 255, 255, 0.05);
            color: #e8edf5;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.25s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-geri:active {
            transform: scale(0.96);
        }

        /* ===== DOSYA ALANI ===== */
        .file-area {
            border: 2px dashed rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px 16px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.4s;
            background: rgba(255, 255, 255, 0.01);
            margin-bottom: 14px;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .file-area:active {
            transform: scale(0.98);
        }

        .file-area.dragover {
            border-color: #f0933e;
            background: rgba(240, 147, 62, 0.05);
        }

        .file-area .icon {
            display: block;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .file-area .text {
            font-size: 14px;
            color: #7a879f;
        }

        .file-area .text strong {
            color: #e8edf5;
            font-weight: 500;
        }

        .file-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-area .file-count {
            display: inline-block;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: #5a687e;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 0.7fr;
            gap: 8px;
            margin-bottom: 18px;
        }

        .btn {
            padding: 12px 14px;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 48px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-upload {
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            box-shadow: 0 4px 20px rgba(240, 147, 62, 0.25);
        }

        .btn-upload:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(240, 147, 62, 0.35);
        }

        .btn-upload:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-upload-all {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.25);
        }

        .btn-upload-all:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(168, 85, 247, 0.35);
        }

        .btn-upload-all:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-folder {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: #fff;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.25);
        }

        .btn-folder:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(6, 182, 212, 0.35);
        }

        .btn-folder:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-list {
            background: rgba(255, 255, 255, 0.05);
            color: #e8edf5;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-list:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-clear {
            background: rgba(248, 81, 73, 0.08);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.1);
        }

        .btn-clear:hover {
            background: rgba(248, 81, 73, 0.16);
            transform: translateY(-2px);
        }

        .btn-download-all {
            background: linear-gradient(135deg, #4cda6c, #2ea043);
            color: #fff;
            box-shadow: 0 4px 20px rgba(76, 218, 108, 0.25);
        }

        .btn-download-all:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(76, 218, 108, 0.35);
        }

        .btn-download-all:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download-missing {
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            color: #fff;
            box-shadow: 0 4px 20px rgba(88, 166, 255, 0.25);
        }

        .btn-download-missing:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(88, 166, 255, 0.35);
        }

        .btn-download-missing:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 2px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .gallery-header .left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #6b7a93;
            font-weight: 500;
            flex-wrap: wrap;
        }

        .gallery-header .count {
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
        }

        .gallery-stats {
            display: flex;
            gap: 10px;
            font-size: 11px;
            color: #7a879f;
        }

        .gallery-stats span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding-top: 2px;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #3e485a;
            padding: 32px 0 24px;
            font-size: 14px;
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.3s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
        }

        .gallery-item:active {
            transform: scale(0.96);
            border-color: rgba(240, 147, 62, 0.25);
        }

        .gallery-item .media {
            width: 100%;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e14;
            overflow: hidden;
            position: relative;
        }

        .gallery-item .media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
            display: block;
        }

        .gallery-item .media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .gallery-item .info {
            padding: 8px 10px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .gallery-item .info .name {
            font-size: 11px;
            color: #6b7a93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .gallery-item .info .actions {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }

        .gallery-item .info .actions button {
            background: none;
            border: none;
            color: #4a5268;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 6px;
            border-radius: 8px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 32px;
        }

        .gallery-item .info .actions button:active {
            transform: scale(0.92);
        }

        .gallery-item .info .actions .download-btn {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            color: #b8c4d4;
            font-weight: 500;
        }

        .gallery-item .info .actions .download-btn:active {
            background: #f0933e;
            color: #fff;
        }

        .gallery-item .info .actions .delete-btn:active {
            color: #f85149;
            background: rgba(248, 81, 73, 0.08);
        }

        .gallery-item .indirildi-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(76, 218, 108, 0.9);
            color: #fff;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* ===== İKON BOYUT ===== */
        .icon-sm {
            width: 14px;
            height: 14px;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .download-btn .icon-sm {
            margin-right: 3px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 96vw;
            max-height: 92vh;
            border-radius: 16px;
            position: relative;
            background: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .modal-content img,
        .modal-content video {
            max-width: 96vw;
            max-height: 85vh;
            display: block;
            object-fit: contain;
            border-radius: 14px;
        }

        .modal-content video {
            background: #000;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .modal-close:active {
            transform: scale(0.9);
        }

        .modal-bottom {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 14px 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 92%;
            z-index: 5;
        }

        .modal-filename {
            color: #9aabbf;
            font-size: 12px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-download {
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .modal-download:active {
            transform: scale(0.95);
        }

        /* ===== İLERLEME ÇUBUĞU ===== */
        .progress-container {
            display: none;
            margin: 10px 0 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .progress-container.active {
            display: block;
        }

        .progress-container .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7a93;
            margin-bottom: 6px;
        }

        .progress-container .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-container .progress-track .progress-fill {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, #a855f7, #7c3aed);
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ===== MOBİL ÖZEL ===== */
        @media (max-width: 480px) {
            body { padding: 8px; }
            .app { padding: 12px; border-radius: 20px; }
            .header { padding: 10px 12px; border-radius: 14px; }
            .header h1 { font-size: 16px; }
            .header-logo { height: 30px; }
            .header-badge { font-size: 9px; padding: 3px 10px; }
            .kisi-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .kisi-card { padding: 16px 10px 14px; border-radius: 16px; }
            .kisi-card .avatar { width: 52px; height: 52px; }
            .kisi-card .isim { font-size: 14px; }
            .repo-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
            .repo-card { padding: 14px 10px; border-radius: 14px; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
            .gallery-item .media { height: 100px; }
            .gallery-item { border-radius: 12px; }
            .gallery-item .info { padding: 6px 8px 8px; }
            .gallery-item .info .name { font-size: 10px; }
            .buttons { grid-template-columns: 1fr 1fr; gap: 6px; }
            .btn { padding: 10px 12px; font-size: 12px; min-height: 42px; }
            .btn-upload-all { grid-column: span 2; }
            .btn-folder { grid-column: span 2; }
            .file-area { padding: 18px 12px 16px; border-radius: 14px; }
            .file-area .text { font-size: 13px; }
            .file-area .icon img { width: 32px !important; height: 32px !important; }
            .modal-bottom { padding: 6px 12px 6px 14px; }
            .modal-filename { max-width: 80px; font-size: 11px; }
            .modal-download { padding: 6px 14px; font-size: 12px; }
            .modal-close { width: 32px; height: 32px; font-size: 16px; top: 8px; right: 10px; }
            .gallery-header { flex-direction: column; align-items: stretch; gap: 4px; }
            .gallery-header .left { justify-content: center; flex-wrap: wrap; }
            .gallery-stats { font-size: 10px; gap: 6px; flex-wrap: wrap; justify-content: center; }
            .status { font-size: 12px; padding: 8px 14px; min-height: 38px; }
            .toast { padding: 10px 14px; font-size: 12px; }
            .toast .icon { font-size: 18px; }
            .input-group input { font-size: 14px; padding: 10px 12px; }
        }

        @media (max-width: 380px) {
            .kisi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .repo-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .gallery { grid-template-columns: 1fr 1fr; gap: 6px; }
            .gallery-item .media { height: 80px; }
            .buttons { grid-template-columns: 1fr; gap: 6px; }
            .btn-upload-all { grid-column: span 1; }
            .btn-folder { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <img class="header-logo" src="https://i.postimg.cc/tCYfpbZy/be371099-de3c-430e-b3de-37d5dbd175fa.png" alt="Logo">
                <h1>📸 Aile Galerisi</h1>
            </div>
            <span class="header-badge">
                ✦ Aile Sistemi
            </span>
        </div>

        <!-- TOKEN -->
        <div class="input-grid">
            <div class="input-group">
                <label>🔑 GitHub Token</label>
                <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
        </div>

        <!-- DURUM -->
        <div class="status" id="status">
            <span class="spinner"></span>
            <span class="msg">✨ Hoş geldiniz</span>
        </div>

        <!-- KİŞİ LİSTESİ -->
        <div id="anaSayfa">
            <div class="kisi-grid" id="kisiGrid"></div>
        </div>

        <!-- REPO SAYFASI -->
        <div id="repoSayfa" class="gizli">
            <button class="btn-geri" id="anaGeriBtn">← Ana Sayfaya Dön</button>
            <div class="repo-grid" id="repoGrid"></div>
        </div>

        <!-- GALERİ SAYFASI -->
        <div id="galeriSayfa" class="gizli">
            <button class="btn-geri" id="repoGeriBtn">← Repolara Dön</button>

            <div class="file-area" id="fileArea">
                <span class="icon">
                    <img src="https://i.postimg.cc/TY1HR0Dk/e625067c-560b-4f86-a39c-725239da40f1-(1)(3).png" alt="Dosya" style="width:36px;height:36px;display:block;margin:0 auto;">
                </span>
                <div class="text">
                    <strong>Dosya seç</strong> veya buraya sürükle
                </div>
                <div class="file-count" id="fileCount">Hiç dosya seçilmedi</div>
                <input type="file" id="fileInput" multiple accept="image/*,video/*">
            </div>

            <div class="buttons">
                <button class="btn btn-upload" id="uploadBtn">📤 Yükle</button>
                <button class="btn btn-upload-all" id="uploadAllBtn">📱 Tüm Galeriyi Yükle</button>
                <button class="btn btn-folder" id="folderBtn">📁 Klasör Seç</button>
                <button class="btn btn-list" id="listBtn">📋 Listele</button>
                <button class="btn btn-clear" id="clearBtn">🗑️ Temizle</button>
                <button class="btn btn-download-all" id="downloadAllBtn">📦 Tümünü İndir</button>
                <button class="btn btn-download-missing" id="downloadMissingBtn">⬇️ Eksikleri İndir</button>
            </div>

            <!-- İlerleme Çubuğu -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-info">
                    <span id="progressText">Hazırlanıyor...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="gallery-header">
                <div class="left">
                    <span>📸 Galeri</span>
                    <span class="count" id="galleryCount">0 dosya</span>
                    <div class="gallery-stats">
                        <span>🖼️ <span id="imageCount">0</span></span>
                        <span>🎬 <span id="videoCount">0</span></span>
                        <span>✅ <span id="downloadedCount">0</span></span>
                    </div>
                </div>
            </div>

            <div class="gallery" id="gallery">
                <div class="gallery-empty">
                    <span style="font-size:40px;display:block;margin-bottom:6px;">📭</span>
                    Henüz fotoğraf yok
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">✕</button>
            <div id="modalMedia"></div>
            <div class="modal-bottom">
                <span class="modal-filename" id="modalFilename">dosya</span>
                <button class="modal-download" id="modalDownload">⬇️ İndir</button>
            </div>
        </div>
    </div>

    <!-- TOAST BİLDİRİM KONTEYNERİ -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==========================================================
        // KİŞİ LİSTESİ
        // ==========================================================
        const kisiler = [{
            id: 'anne',
            isim: 'Anne',
            avatar: 'https://i.postimg.cc/fbVMzK5n/e18cdae2-d73a-44f2-9259-c57d27dad1b2.png',
            repolar: ['anne-1', 'anne-2', 'anne-3', 'anne-4'],
            limit: 2000
        }, {
            id: 'sen',
            isim: 'Sen',
            avatar: 'https://i.postimg.cc/cHYZYLVt/54aa9db1-bd7b-4b58-afb6-59e8c19ae4b9.png',
            repolar: ['mm2-1', 'mm2-2'],
            limit: 2000
        }, {
            id: 'abla',
            isim: 'Abla',
            avatar: 'https://i.postimg.cc/6qfXj16T/01fdd5cd-9598-45d2-b19a-7c6fbd51bcc0.png',
            repolar: ['abla-1', 'abla-2'],
            limit: 2000
        }];

        // ==========================================================
        // DURUM
        // ==========================================================
        let aktifKisi = null;
        let aktifRepo = null;

        // ==========================================================
        // DOM
        // ==========================================================
        const tokenInput = document.getElementById('token');
        const statusEl = document.getElementById('status');
        const statusMsg = statusEl.querySelector('.msg');
        const kisiGrid = document.getElementById('kisiGrid');
        const repoGrid = document.getElementById('repoGrid');
        const anaSayfa = document.getElementById('anaSayfa');
        const repoSayfa = document.getElementById('repoSayfa');
        const galeriSayfa = document.getElementById('galeriSayfa');
        const anaGeriBtn = document.getElementById('anaGeriBtn');
        const repoGeriBtn = document.getElementById('repoGeriBtn');

        const fileInput = document.getElementById('fileInput');
        const fileArea = document.getElementById('fileArea');
        const fileCount = document.getElementById('fileCount');
        const galleryCount = document.getElementById('galleryCount');
        const imageCount = document.getElementById('imageCount');
        const videoCount = document.getElementById('videoCount');
        const downloadedCount = document.getElementById('downloadedCount');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadAllBtn = document.getElementById('uploadAllBtn');
        const folderBtn = document.getElementById('folderBtn');
        const listBtn = document.getElementById('listBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const downloadMissingBtn = document.getElementById('downloadMissingBtn');
        const gallery = document.getElementById('gallery');

        const modal = document.getElementById('modal');
        const modalMedia = document.getElementById('modalMedia');
        const modalFilename = document.getElementById('modalFilename');
        const modalClose = document.getElementById('modalClose');
        const modalDownload = document.getElementById('modalDownload');
        const toastContainer = document.getElementById('toastContainer');

        // İlerleme çubuğu
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');

        let currentModalUrl = '';
        let currentModalName = '';
        let mevcutDosyalar = [];

        // ==========================================================
        // İNDİRİLENLERİ YÖNET
        // ==========================================================
        function getIndirilenler() {
            const key = `indirilenler_${aktifRepo || 'default'}`;
            try {
                return JSON.parse(localStorage.getItem(key)) || [];
            } catch {
                return [];
            }
        }

        function setIndirilenler(dosyalar) {
            const key = `indirilenler_${aktifRepo || 'default'}`;
            localStorage.setItem(key, JSON.stringify(dosyalar));
        }

        function dosyaIndirildiMi(dosyaAdi) {
            const indirilenler = getIndirilenler();
            return indirilenler.includes(dosyaAdi);
        }

        function dosyaIndirildiOlarakIsaretle(dosyaAdi) {
            const indirilenler = getIndirilenler();
            if (!indirilenler.includes(dosyaAdi)) {
                indirilenler.push(dosyaAdi);
                setIndirilenler(indirilenler);
            }
        }

        function dosyaIndirildiKaldir(dosyaAdi) {
            const indirilenler = getIndirilenler();
            const index = indirilenler.indexOf(dosyaAdi);
            if (index > -1) {
                indirilenler.splice(index, 1);
                setIndirilenler(indirilenler);
            }
        }

        function indirilenleriTemizle() {
            const key = `indirilenler_${aktifRepo || 'default'}`;
            localStorage.removeItem(key);
        }

        function getIndirilenSayisi() {
            return getIndirilenler().length;
        }

        function getEksikDosyalar(tumDosyalar) {
            const indirilenler = getIndirilenler();
            return tumDosyalar.filter(d => !indirilenler.includes(d.name));
        }

        // ==========================================================
        // TOAST BİLDİRİM
        // ==========================================================
        function showToast(icon, message, subMessage = '', type = 'info', duration = 4000) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="icon">${icon}</span>
                <div class="content">
                    ${message}
                    ${subMessage ? `<span class="sub">${subMessage}</span>` : ''}
                </div>
                <button class="close-btn" onclick="this.closest('.toast').remove()">✕</button>
            `;
            toastContainer.appendChild(toast);
            
            if (duration > 0) {
                setTimeout(() => {
                    toast.classList.add('hide');
                    setTimeout(() => toast.remove(), 400);
                }, duration);
            }
            
            return toast;
        }

        // ==========================================================
        // YARDIMCI
        // ==========================================================
        function setStatus(text, type = '') {
            statusEl.className = 'status' + (type ? ' ' + type : '');
            statusMsg.innerHTML = text;
        }

        function getConfig() {
            return {
                user: 'mm2vault',
                repo: aktifRepo,
                token: tokenInput.value.trim() || localStorage.getItem('githubToken') || ''
            };
        }

        function getFileList() { return Array.from(fileInput.files); }

        function updateFileCount() {
            const files = getFileList();
            fileCount.textContent = files.length === 0 ? 'Hiç dosya seçilmedi' : `${files.length} dosya seçildi`;
        }

        fileInput.addEventListener('change', updateFileCount);

        // ==========================================================
        // DRAG & DROP
        // ==========================================================
        fileArea.addEventListener('dragover', e => {
            e.preventDefault();
            fileArea.classList.add('dragover');
        });
        fileArea.addEventListener('dragleave', () => fileArea.classList.remove('dragover'));
        fileArea.addEventListener('drop', e => {
            e.preventDefault();
            fileArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileCount();
            }
        });

        // ==========================================================
        // REPO DOSYA SAYISINI ÇEK
        // ==========================================================
        async function getRepoFileCount(repoAdi) {
            const cfg = getConfig();
            if (!cfg.token) return 0;

            try {
                const url = `https://api.github.com/repos/${cfg.user}/${repoAdi}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (!res.ok) return 0;
                const data = await res.json();
                return data.length || 0;
            } catch {
                return 0;
            }
        }

        // ==========================================================
        // KİŞİLERİ LİSTELE
        // ==========================================================
        async function renderKisiler() {
            kisiGrid.innerHTML = '';
            const cfg = getConfig();

            if (!cfg.token || !cfg.token.startsWith('ghp_')) {
                kisiGrid.innerHTML =
                    '<p style="color:#6b7a93;text-align:center;padding:16px;grid-column:1/-1;font-size:13px;">⚠️ Lütfen geçerli bir GitHub token girin.</p>';
                return;
            }

            setStatus('📡 Bilgiler alınıyor...', 'loading');

            for (const kisi of kisiler) {
                let toplamDosya = 0;

                for (const repoAdi of kisi.repolar) {
                    const sayi = await getRepoFileCount(repoAdi);
                    toplamDosya += sayi;
                }

                const oran = Math.min((toplamDosya / kisi.limit) * 100, 100);
                let durumRengi = '#4cda6c';
                let durumText = 'Boş';
                if (oran >= 90) { durumRengi = '#f85149';
                    durumText = 'Dolu'; } else if (oran >= 50) { durumRengi = '#f0933e';
                    durumText = 'Yarı Dolu'; }

                const kart = document.createElement('div');
                kart.className = 'kisi-card';

                kart.innerHTML = `
                    <img class="avatar" src="${kisi.avatar}" alt="${kisi.isim}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect width=%2280%22 height=%2280%22 fill=%22%23161b22%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%234a5268%22 font-size=%2240%22>${kisi.id === 'anne' ? '👩' : kisi.id === 'sen' ? '🧑' : '👩'}</text></svg>'">
                    <div class="isim">${kisi.isim}</div>
                    <div class="kisi-stats">
                        <span>📁 ${toplamDosya}</span>
                        <span>•</span>
                        <span style="color:${durumRengi};">${Math.round(oran)}%</span>
                        <span style="color:#4a5268;font-size:10px;">(${durumText})</span>
                    </div>
                    <div class="progress-bar">
                        <div class="fill" style="width:${oran}%;"></div>
                    </div>
                    <span class="kilit">🔓</span>
                `;

                kart.addEventListener('click', () => {
                    aktifKisi = kisi;
                    repoGoster(kisi);
                });

                kisiGrid.appendChild(kart);
            }

            setStatus(`✅ ${kisiler.length} kişi yüklendi`, 'success');
        }

        // ==========================================================
        // REPOLARI GÖSTER
        // ==========================================================
        function repoGoster(kisi) {
            anaSayfa.classList.add('gizli');
            repoSayfa.classList.remove('gizli');
            galeriSayfa.classList.add('gizli');
            repoGrid.innerHTML = '';

            for (const repoAdi of kisi.repolar) {
                const kart = document.createElement('div');
                kart.className = 'repo-card';
                kart.innerHTML = `
                    <span class="repo-avatar">📁</span>
                    <div class="repo-isim">${kisi.isim} - ${repoAdi}</div>
                    <div class="repo-ad">${repoAdi}</div>
                `;
                kart.addEventListener('click', () => {
                    aktifRepo = repoAdi;
                    galeriAc(repoAdi);
                });
                repoGrid.appendChild(kart);
            }

            setStatus(`📂 ${kisi.isim} - Repolar`, '');
        }

        // ==========================================================
        // GALERİ AÇ
        // ==========================================================
        function galeriAc(repoAdi) {
            repoSayfa.classList.add('gizli');
            galeriSayfa.classList.remove('gizli');
            setStatus(`📂 ${repoAdi}`, '');
            listFiles();
        }

        // ==========================================================
        // GERİ BUTONLARI
        // ==========================================================
        function anaSayfayaDon() {
            repoSayfa.classList.add('gizli');
            galeriSayfa.classList.add('gizli');
            anaSayfa.classList.remove('gizli');
            aktifKisi = null;
            aktifRepo = null;
            renderKisiler();
        }

        anaGeriBtn.addEventListener('click', anaSayfayaDon);

        function repolaraDon() {
            galeriSayfa.classList.add('gizli');
            repoSayfa.classList.remove('gizli');
            if (aktifKisi) {
                setStatus(`📂 ${aktifKisi.isim} - Repolar`, '');
            }
            gallery.innerHTML = '';
            galleryCount.textContent = '0 dosya';
            imageCount.textContent = '0';
            videoCount.textContent = '0';
            downloadedCount.textContent = '0';
            progressContainer.classList.remove('active');
        }

        repoGeriBtn.addEventListener('click', repolaraDon);

        // ==========================================================
        // LİSTELEME
        // ==========================================================
        async function listFiles() {
            const cfg = getConfig();
            if (!cfg.token || !cfg.token.startsWith('ghp_')) {
                setStatus('❌ Geçerli GitHub token gerekli!', 'error');
                showToast('❌', 'Geçerli GitHub token gerekli!', 'Lütfen token\'ınızı kontrol edin.', 'error', 4000);
                return;
            }
            if (!cfg.repo) {
                setStatus('❌ Repo seçili değil', 'error');
                showToast('⚠️', 'Repo seçili değil', 'Lütfen bir repo seçin.', 'warning', 3000);
                return;
            }

            setStatus('⏳ Yükleniyor...', 'loading');
            gallery.innerHTML = '';

            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });

                if (res.status === 404) {
                    setStatus('📭 Klasör boş', '');
                    gallery.innerHTML =
                        `<div class="gallery-empty"><span style="font-size:40px;display:block;margin-bottom:6px;">📭</span>Henüz fotoğraf yok</div>`;
                    galleryCount.textContent = '0 dosya';
                    imageCount.textContent = '0';
                    videoCount.textContent = '0';
                    downloadedCount.textContent = '0';
                    mevcutDosyalar = [];
                    return;
                }

                if (!res.ok) {
                    const err = await res.json();
                    setStatus(`❌ ${err.message || 'Hata'}`, 'error');
                    showToast('❌', 'Listeleme hatası', err.message || 'Dosyalar alınamadı.', 'error', 4000);
                    return;
                }

                const data = await res.json();
                mevcutDosyalar = data || [];
                
                if (!data || !data.length) {
                    setStatus('📭 Boş', '');
                    gallery.innerHTML =
                        `<div class="gallery-empty"><span style="font-size:40px;display:block;margin-bottom:6px;">📭</span>Henüz fotoğraf yok</div>`;
                    galleryCount.textContent = '0 dosya';
                    imageCount.textContent = '0';
                    videoCount.textContent = '0';
                    downloadedCount.textContent = '0';
                    return;
                }

                let imgSay = 0,
                    vidSay = 0;
                data.forEach(item => {
                    if (/\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name)) vidSay++;
                    else if (/\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name)) imgSay++;
                });
                imageCount.textContent = imgSay;
                videoCount.textContent = vidSay;
                
                const indirilenSayisi = getIndirilenSayisi();
                downloadedCount.textContent = indirilenSayisi;

                setStatus(`📸 ${data.length} dosya bulundu (${indirilenSayisi} indirildi)`, 'success');
                galleryCount.textContent = `${data.length} dosya`;

                const fragment = document.createDocumentFragment();
                data.sort((a, b) => a.name.localeCompare(b.name)).reverse();

                for (const item of data) {
                    const rawUrl =
                        `https://raw.githubusercontent.com/${cfg.user}/${cfg.repo}/main/fotolar/${encodeURIComponent(item.name)}`;
                    const isVideo = /\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name);
                    const isImage = /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name);
                    const indirildi = dosyaIndirildiMi(item.name);

                    const div = document.createElement('div');
                    div.className = 'gallery-item';

                    let mediaHtml = '';
                    if (isVideo) {
                        mediaHtml = `
                            <div class="media" onclick="openModal('${rawUrl}','${item.name}',true)">
                                <video src="${rawUrl}" preload="metadata" playsinline muted></video>
                            </div>
                        `;
                    } else if (isImage) {
                        mediaHtml = `
                            <div class="media" onclick="openModal('${rawUrl}','${item.name}',false)">
                                <img src="${rawUrl}" loading="lazy" onerror="this.parentElement.innerHTML='<span style=color:#4a5268;font-size:18px;>⚠️</span>'">
                            </div>
                        `;
                    } else {
                        mediaHtml = `
                            <div class="media" style="color:#4a5268;font-size:12px;text-align:center;padding:10px;">📄 ${item.name}</div>
                        `;
                    }

        async function downloadAll() {
            if (!mevcutDosyalar || mevcutDosyalar.length === 0) {
                showToast('⚠️', 'İndirilecek dosya yok', 'Galeri boş.', 'warning', 3000);
                return;
            }

            const cfg = getConfig();
            if (!cfg.token || !cfg.repo) {
                showToast('❌', 'Token veya repo seçili değil', '', 'error', 3000);
                return;
            }

            progressContainer.classList.add('active');
            downloadAllBtn.disabled = true;
            downloadAllBtn.textContent = '⏳ İndiriliyor...';

            try {
                const total = mevcutDosyalar.length;
                let downloaded = 0;
                const files = [];

                for (const item of mevcutDosyalar) {
                    if (dosyaIndirildiMi(item.name)) {
                        downloaded++;
                        continue;
                    }

                    const rawUrl =
                        `https://raw.githubusercontent.com/${cfg.user}/${cfg.repo}/main/fotolar/${encodeURIComponent(item.name)}`;
                    
                    progressText.textContent = `${item.name} indiriliyor... (${downloaded+1}/${total})`;
                    const percent = Math.round((downloaded / total) * 100);
                    progressFill.style.width = `${percent}%`;
                    progressPercent.textContent = `${percent}%`;

                    try {
                        const response = await fetch(rawUrl);
                        if (response.ok) {
                            const blob = await response.blob();
                            files.push({
                                name: item.name,
                                blob: blob
                            });
                            dosyaIndirildiOlarakIsaretle(item.name);
                        }
                    } catch (e) {
                        console.error(`${item.name} indirilemedi:`, e);
                    }

                    downloaded++;
                    const newPercent = Math.round((downloaded / total) * 100);
                    progressFill.style.width = `${newPercent}%`;
                    progressPercent.textContent = `${newPercent}%`;
                }

                if (files.length === 0) {
                    progressText.textContent = '✅ Tüm dosyalar zaten indirilmiş!';
                    showToast('✅', 'Tüm dosyalar zaten indirilmiş!', '', 'success', 3000);
                    setTimeout(() => {
                        progressContainer.classList.remove('active');
                        progressFill.style.width = '0%';
                        progressPercent.textContent = '0%';
                    }, 2000);
                    return;
                }

                progressText.textContent = 'ZIP oluşturuluyor...';

                const zip = new JSZip();
                for (const file of files) {
                    zip.file(file.name, file.blob);
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const zipUrl = URL.createObjectURL(zipBlob);
                
                const link = document.createElement('a');
                link.href = zipUrl;
                link.download = `${cfg.repo}-galeri.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(zipUrl), 5000);

                progressText.textContent = '✅ Tamamlandı!';
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';

                const yeniIndirilen = getIndirilenSayisi();
                downloadedCount.textContent = yeniIndirilen;

                showToast('📦', 'Tüm dosyalar indirildi!', `${files.length} yeni dosya ZIP olarak kaydedildi.`, 'success', 4000);
                
                setTimeout(() => {
                    progressContainer.classList.remove('active');
                    progressFill.style.width = '0%';
                    progressPercent.textContent = '0%';
                    listFiles();
                }, 3000);

            } catch (e) {
                console.error('İndirme hatası:', e);
                showToast('❌', 'İndirme hatası', e.message || 'Bilinmeyen hata.', 'error', 4000);
            } finally {
                downloadAllBtn.disabled = false;
                downloadAllBtn.textContent = '📦 Tümünü İndir';
            }
        }

        // ==========================================================
        // YÜKLEME
        // ==========================================================
        async function uploadFiles() {
            const cfg = getConfig();
            if (!cfg.token || !cfg.token.startsWith('ghp_')) {
                setStatus('❌ Geçerli GitHub token gerekli!', 'error');
                showToast('❌', 'Geçerli GitHub token gerekli!', 'Lütfen token\'ınızı kontrol edin.', 'error', 4000);
                return;
            }
            if (!cfg.repo) {
                setStatus('❌ Repo seçili değil', 'error');
                showToast('⚠️', 'Repo seçili değil', 'Lütfen bir repo seçin.', 'warning', 3000);
                return;
            }

            const files = getFileList();
            if (!files.length) {
                setStatus('⚠️ Lütfen dosya seç', 'error');
                showToast('⚠️', 'Dosya seçilmedi', 'Lütfen en az bir dosya seçin.', 'warning', 3000);
                return;
            }

            uploadBtn.disabled = true;
            let success = 0,
                failed = 0;

            progressContainer.classList.add('active');
            const totalFiles = files.length;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const percent = Math.round((i / totalFiles) * 100);
                progressFill.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
                progressText.textContent = `${file.name} yükleniyor... (${i+1}/${totalFiles})`;
                
                setStatus(`⏳ ${file.name} (${i + 1}/${totalFiles})`, 'loading');
                try {
                    const base64 = await toBase64(file);
                    const url =
                        `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(file.name)}`;
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Yükle: ${file.name}`,
                            content: base64
                        })
                    });
                    if (res.ok) {
                        success++;
                    } else {
                        const err = await res.json();
                        if (err.message && err.message.includes('already exists')) {
                            showToast('⚠️', `${file.name} zaten var`, 'Aynı isimli dosya mevcut.', 'warning', 3000);
                        }
                        failed++;
                    }
                } catch {
                    failed++;
                }
            }

            progressFill.style.width = '100%';
            progressPercent.textContent = '100%';
            progressText.textContent = '✅ Tamamlandı!';

            uploadBtn.disabled = false;

            setTimeout(() => {
                progressContainer.classList.remove('active');
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
            }, 2000);

            if (failed === 0 && success > 0) {
                setStatus(`✅ ${success} dosya yüklendi`, 'success');
                showToast('✅', `${success} dosya yüklendi`, 'Galeri yenileniyor...', 'success', 3000);
                fileInput.value = '';
                updateFileCount();
                setTimeout(() => {
                    listFiles();
                    renderKisiler();
                }, 2000);
            } else if (success > 0) {
                setStatus(`⚠️ ${success} başarılı, ${failed} hata`, 'error');
                showToast('⚠️', `${success} başarılı, ${failed} hata`, 'Bazı dosyalar yüklenemedi.', 'warning', 4000);
                fileInput.value = '';
                updateFileCount();
                setTimeout(() => {
                    listFiles();
                    renderKisiler();
                }, 2000);
            } else {
                setStatus('❌ Hiçbir dosya yüklenemedi', 'error');
                showToast('❌', 'Yükleme başarısız', 'Hiçbir dosya yüklenemedi.', 'error', 4000);
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        uploadBtn.addEventListener('click', uploadFiles);

        // ==========================================================
        // İNDİRME (TEK DOSYA)
        // ==========================================================
        function downloadFile(url, filename) {
            showToast('⏳', `${filename} indiriliyor...`, 'Lütfen bekleyin.', 'info', 2000);

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Dosya alınamadı');
                    return response.blob();
                })
                .then(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);

                    dosyaIndirildiOlarakIsaretle(filename);
                    const yeniIndirilen = getIndirilenSayisi();
                    downloadedCount.textContent = yeniIndirilen;
                    
                    showToast('✅', `"${filename}" indirildi!`, 'Dosya başarıyla kaydedildi.', 'success', 3000);
                    listFiles();
                })
                .catch(() => {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    dosyaIndirildiOlarakIsaretle(filename);
                    const yeniIndirilen = getIndirilenSayisi();
                    downloadedCount.textContent = yeniIndirilen;

                    showToast('⚠️', `"${filename}" indirildi`, 'Alternatif yöntem kullanıldı.', 'warning', 3000);
                    listFiles();
                });
        }

        modalDownload.addEventListener('click', () => {
            if (currentModalUrl) downloadFile(currentModalUrl, currentModalName);
        });

        // ==========================================================
        // ÖZEL ONAY DİYALOĞU

        function showConfirmDialog(title, message, subMessage = '') {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed;
                    inset: 0;
                    background: rgba(0, 0, 0, 0.85);
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);
                    z-index: 10000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 16px;
                    animation: fadeIn 0.25s ease;
                `;
                
                const dialog = document.createElement('div');
                dialog.style.cssText = `
                    background: rgba(22, 30, 44, 0.95);
                    border: 1px solid rgba(255, 255, 255, 0.08);
                    border-radius: 20px;
                    padding: 28px 24px 20px;
                    max-width: 400px;
                    width: 100%;
                    text-align: center;
                    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
                    animation: scaleIn 0.3s ease;
                `;
                
                dialog.innerHTML = `
                    <div style="font-size: 40px; margin-bottom: 10px;">${title.split(' ')[0]}</div>
                    <h3 style="color: #e8edf5; font-size: 18px; font-weight: 600; margin-bottom: 6px;">${title}</h3>
                    <p style="color: #b8c4d4; font-size: 14px; margin-bottom: 4px; line-height: 1.5;">${message}</p>
                    ${subMessage ? `<p style="color: #f85149; font-size: 12px; margin-bottom: 16px; font-weight: 500;">⚠️ ${subMessage}</p>` : '<div style="height: 6px;"></div>'}
                    <div style="display: flex; gap: 10px;">
                        <button id="confirmCancel" style="
                            flex: 1;
                            padding: 11px;
                            background: rgba(255, 255, 255, 0.05);
                            border: 1px solid rgba(255, 255, 255, 0.06);
                            border-radius: 12px;
                            color: #7a879f;
                            font-size: 13px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: 0.25s;
                            font-family: inherit;
                            -webkit-tap-highlight-color: transparent;
                            touch-action: manipulation;
                        ">Vazgeç</button>
                        <button id="confirmDelete" style="
                            flex: 1;
                            padding: 11px;
                            background: linear-gradient(135deg, #f85149, #da3633);
                            border: none;
                            border-radius: 12px;
                            color: #fff;
                            font-size: 13px;
                            font-weight: 600;
                            cursor: pointer;
                            transition: 0.25s;
                            font-family: inherit;
                            box-shadow: 0 4px 20px rgba(248, 81, 73, 0.25);
                            -webkit-tap-highlight-color: transparent;
                            touch-action: manipulation;
                        ">🗑️ Sil</button>
                    </div>
                `;
                
                overlay.appendChild(dialog);
                document.body.appendChild(overlay);
                
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes fadeIn {
                        from { opacity: 0; }
                        to { opacity: 1; }
                    }
                    @keyframes scaleIn {
                        from { transform: scale(0.9); opacity: 0; }
                        to { transform: scale(1); opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
                
                const cancelBtn = dialog.querySelector('#confirmCancel');
                const deleteBtn = dialog.querySelector('#confirmDelete');
                
                cancelBtn.addEventListener('mouseenter', () => {
                    cancelBtn.style.background = 'rgba(255, 255, 255, 0.08)';
                });
                cancelBtn.addEventListener('mouseleave', () => {
                    cancelBtn.style.background = 'rgba(255, 255, 255, 0.05)';
                });
                
                deleteBtn.addEventListener('mouseenter', () => {
                    deleteBtn.style.transform = 'scale(1.02)';
                    deleteBtn.style.boxShadow = '0 6px 30px rgba(248, 81, 73, 0.4)';
                });
                deleteBtn.addEventListener('mouseleave', () => {
                    deleteBtn.style.transform = 'scale(1)';
                    deleteBtn.style.boxShadow = '0 4px 20px rgba(248, 81, 73, 0.25)';
                });
                
                cancelBtn.addEventListener('touchstart', () => {
                    cancelBtn.style.background = 'rgba(255, 255, 255, 0.12)';
                });
                cancelBtn.addEventListener('touchend', () => {
                    cancelBtn.style.background = 'rgba(255, 255, 255, 0.05)';
                });
                
                deleteBtn.addEventListener('touchstart', () => {
                    deleteBtn.style.transform = 'scale(0.95)';
                });
                deleteBtn.addEventListener('touchend', () => {
                    deleteBtn.style.transform = 'scale(1)';
                });
                
                const cleanup = (result) => {
                    overlay.style.opacity = '0';
                    overlay.style.transition = 'opacity 0.25s';
                    setTimeout(() => {
                        overlay.remove();
                        style.remove();
                        resolve(result);
                    }, 250);
                };
                
                cancelBtn.addEventListener('click', () => cleanup(false));
                deleteBtn.addEventListener('click', () => cleanup(true));
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) cleanup(false);
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') cleanup(false);
                }, { once: true });
            });
        }

        // ==========================================================
        // SİLME
        // ==========================================================
        async function deleteFile(filename, sha) {
            const confirmed = await showConfirmDialog(
                '🗑️ Dosyayı Sil',
                `"${filename}" dosyasını kalıcı olarak silmek istediğinize emin misiniz?`,
                'Bu işlem geri alınamaz!'
            );
            
            if (!confirmed) {
                showToast('ℹ️', 'Silme iptal edildi', '', 'info', 2000);
                return;
            }

            const cfg = getConfig();
            if (!cfg.token || !cfg.repo) {
                setStatus('❌ Token veya repo seçili değil', 'error');
                showToast('❌', 'Hata', 'Token veya repo seçili değil.', 'error', 3000);
                return;
            }

            setStatus(`⏳ Siliniyor: ${filename}`, 'loading');
            
            const loadingToast = showToast('⏳', `${filename} siliniyor...`, 'Lütfen bekleyin.', 'info', 0);
            
            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(filename)}`;
                const res = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: `Sil: ${filename}`, sha: sha })
                });

                if (loadingToast) loadingToast.remove();

                if (res.ok) {
                    dosyaIndirildiKaldir(filename);
                    const yeniIndirilen = getIndirilenSayisi();
                    downloadedCount.textContent = yeniIndirilen;
                    
                    setStatus(`🗑️ "${filename}" silindi`, 'success');
                    showToast('✅', `"${filename}" silindi`, 'Dosya başarıyla kaldırıldı.', 'success', 3000);
                    
                    if (navigator.vibrate) navigator.vibrate(50);
                    
                    setTimeout(() => {
                        listFiles();
                        renderKisiler();
                    }, 1500);
                } else {
                    const err = await res.json();
                    setStatus(`❌ Silinemedi: ${err.message || 'Hata'}`, 'error');
                    showToast('❌', 'Silme başarısız', err.message || 'Dosya silinemedi.', 'error', 4000);
                }
            } catch (e) {
                if (loadingToast) loadingToast.remove();
                setStatus(`❌ ${e.message}`, 'error');
                showToast('❌', 'Hata', e.message, 'error', 4000);
            }
        }

        // ==========================================================
        // TÜMÜNÜ TEMİZLE
        // ==========================================================
        async function clearAll() {
            const confirmed = await showConfirmDialog(
                '⚠️ Tümünü Temizle',
                'Tüm dosyaları kalıcı olarak silmek istediğinize emin misiniz?',
                'Bu işlem geri alınamaz ve tüm dosyalar kaybolacak!'
            );
            
            if (!confirmed) {
                showToast('ℹ️', 'Temizleme iptal edildi', '', 'info', 2000);
                return;
            }

            const cfg = getConfig();
            if (!cfg.token || !cfg.repo) {
                setStatus('❌ Token veya repo seçili değil', 'error');
                return;
            }

            setStatus('⏳ Temizleniyor...', 'loading');
            const loadingToast = showToast('⏳', 'Tüm dosyalar siliniyor...', 'Lütfen bekleyin.', 'info', 0);
            
            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (!res.ok) { 
                    if (loadingToast) loadingToast.remove();
                    setStatus('❌ Liste alınamadı', 'error'); 
                    return; 
                }
                const data = await res.json();
                if (!data.length) { 
                    if (loadingToast) loadingToast.remove();
                    setStatus('📭 Zaten boş', ''); 
                    return; 
                }

                let deleted = 0;
                for (const item of data) {
                    const del = await fetch(`${url}/${encodeURIComponent(item.name)}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: `Toplu sil`, sha: item.sha })
                    });
                    if (del.ok) deleted++;
                }
                
                if (loadingToast) loadingToast.remove();
                indirilenleriTemizle();
                downloadedCount.textContent = '0';
                
                setStatus(`🗑️ ${deleted} dosya silindi`, 'success');
                showToast('🗑️', `${deleted} dosya silindi`, 'Tüm dosyalar temizlendi.', 'success', 3000);
                
                if (navigator.vibrate) navigator.vibrate(50);
                
                setTimeout(() => {
                    listFiles();
                    renderKisiler();
                }, 2000);
            } catch (e) {
                if (loadingToast) loadingToast.remove();
                setStatus(`❌ ${e.message}`, 'error');
                showToast('❌', 'Hata', e.message, 'error', 4000);
            }
        }

        clearBtn.addEventListener('click', clearAll);

        // ==========================================================
        // TOKEN HATIRLAMA
        // ==========================================================
        tokenInput.addEventListener('change', () => {
            const token = tokenInput.value.trim();
            if (token && token.startsWith('ghp_')) {
                localStorage.setItem('githubToken', token);
                setStatus('✅ Token kaydedildi', 'success');
                showToast('🔑', 'Token kaydedildi', 'Artık otomatik kullanılacak.', 'success', 2500);
                renderKisiler();
            }
        });

        // ==========================================================
        // BAŞLANGIÇ
        // ==========================================================
        const kayitliToken = localStorage.getItem('githubToken');
        if (kayitliToken && kayitliToken.startsWith('ghp_')) {
            tokenInput.value = kayitliToken;
            setStatus('✨ Aile sistemine hoş geldiniz', '');
            renderKisiler();
            showToast('👋', 'Hoş geldin!', 'Aile Galerisi hazır.', 'info', 2000);
        } else {
            setStatus('🔑 Lütfen GitHub token\'ını girin', '');
            renderKisiler();
            showToast('🔑', 'Token gerekli', 'Lütfen GitHub token\'ınızı girin.', 'info', 4000);
        }
    </script>
