<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📸 Gallery Cloud</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/tCYfpbZy/be371099-de3c-430e-b3de-37d5dbd175fa.png">
    <style>
        /* ===== TEMEL ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(ellipse at 50% 0%, #1a2332 0%, #0b0e14 70%);
        }
        .app {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            background: rgba(18, 26, 38, 0.88);
            backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(240,147,62,0.08), rgba(230,126,34,0.04));
            border-radius: 20px;
            border: 1px solid rgba(240,147,62,0.1);
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-logo { height: 44px; width: auto; border-radius: 12px; }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0e6d0, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-badge {
            background: linear-gradient(135deg, rgba(240,147,62,0.15), rgba(230,126,34,0.05));
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: #f0933e;
            border: 1px solid rgba(240,147,62,0.15);
        }

        /* ===== TOKEN ===== */
        .input-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label {
            font-size: 10px;
            font-weight: 600;
            color: #8892a8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group input {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 14px;
            color: #e8edf5;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
            width: 100%;
        }
        .input-group input:focus {
            border-color: #f0933e;
            box-shadow: 0 0 0 4px rgba(240,147,62,0.08);
            background: rgba(255,255,255,0.06);
        }
        .input-group input::placeholder { color: #3e485a; }

        /* ===== REPO BUTONLARI ===== */
        .repo-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .repo-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px 18px;
            color: #e8edf5;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }
        .repo-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(240,147,62,0.2); }
        .repo-btn.active {
            background: rgba(240,147,62,0.12);
            border-color: #f0933e;
            color: #f0933e;
        }
        .repo-btn .doluluk {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
        }
        .repo-btn .doluluk.dolu { color: #f85149; background: rgba(248,81,73,0.08); }
        .repo-btn .doluluk.yari { color: #f0933e; background: rgba(240,147,62,0.08); }
        .repo-btn .doluluk.bos { color: #4cda6c; background: rgba(46,160,67,0.08); }
        .repo-btn .dosya-sayisi { font-size: 11px; color: #4a5268; }

        /* ===== DURUM ===== */
        .status {
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #7a879f;
            border: 1px solid rgba(255,255,255,0.04);
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
        }
        .status .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.08);
            border-top-color: #f0933e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        .status.loading .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== DOSYA ALANI ===== */
        .file-area {
            border: 2px dashed rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 30px 20px 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.4s;
            background: rgba(255,255,255,0.01);
            margin-bottom: 18px;
            position: relative;
        }
        .file-area:hover { border-color: rgba(240,147,62,0.3); background: rgba(255,255,255,0.03); }
        .file-area.dragover { border-color: #f0933e; background: rgba(240,147,62,0.05); }
        .file-area .icon { display: block; margin-bottom: 4px; opacity: 0.9; }
        .file-area .text { font-size: 15px; color: #7a879f; }
        .file-area .text strong { color: #e8edf5; font-weight: 500; }
        .file-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .file-area .file-count {
            display: inline-block;
            margin-top: 10px;
            background: rgba(255,255,255,0.04);
            padding: 3px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: #5a687e;
        }

        /* ===== BUTONLAR ===== */
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 0.7fr;
            gap: 10px;
            margin-bottom: 24px;
        }
        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn-upload {
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            box-shadow: 0 4px 20px rgba(240,147,62,0.25);
        }
        .btn-upload:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(240,147,62,0.35); }
        .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-list {
            background: rgba(255,255,255,0.05);
            color: #e8edf5;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-list:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .btn-clear {
            background: rgba(248,81,73,0.08);
            color: #f85149;
            border: 1px solid rgba(248,81,73,0.1);
        }
        .btn-clear:hover { background: rgba(248,81,73,0.16); transform: translateY(-2px); }

        /* ===== GALERİ ===== */
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 14px;
            border-top: 1px solid rgba(255,255,255,0.04);
            margin-top: 2px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .gallery-header .left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #6b7a93;
            font-weight: 500;
            flex-wrap: wrap;
        }
        .gallery-header .count {
            background: rgba(255,255,255,0.04);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
        }
        .gallery-stats {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: #7a879f;
        }
        .gallery-stats span { display: flex; align-items: center; gap: 4px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding-top: 2px;
        }
        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #3e485a;
            padding: 48px 0 32px;
            font-size: 15px;
        }
        .gallery-item {
            background: rgba(255,255,255,0.02);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
            transition: 0.4s;
            cursor: pointer;
        }
        .gallery-item:hover {
            border-color: rgba(240,147,62,0.25);
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .gallery-item .media {
            width: 100%;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e14;
            overflow: hidden;
            position: relative;
        }
        .gallery-item .media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
            display: block;
        }
        .gallery-item:hover .media img { transform: scale(1.05); }
        .gallery-item .media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }
        .gallery-item .info {
            padding: 10px 14px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .gallery-item .info .name {
            font-size: 12px;
            color: #6b7a93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .gallery-item .info .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .gallery-item .info .actions button {
            background: none;
            border: none;
            color: #4a5268;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 8px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .gallery-item .info .actions .download-btn {
            background: rgba(255,255,255,0.04);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #b8c4d4;
            font-weight: 500;
        }
        .gallery-item .info .actions .download-btn:hover { background: #f0933e; color: #fff; }
        .gallery-item .info .actions .delete-btn:hover {
            color: #f85149;
            background: rgba(248,81,73,0.08);
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.94);
            backdrop-filter: blur(20px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal.active { display: flex; }
        .modal-content {
            max-width: 94vw;
            max-height: 92vh;
            border-radius: 20px;
            position: relative;
            background: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
        }
        .modal-content img, .modal-content video {
            max-width: 94vw;
            max-height: 85vh;
            display: block;
            object-fit: contain;
            border-radius: 16px;
        }
        .modal-content video { background: #000; }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            font-size: 22px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .modal-close:hover { background: rgba(255,255,255,0.1); transform: rotate(90deg); }
        .modal-bottom {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(16px);
            padding: 10px 18px 10px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.06);
            max-width: 90%;
            z-index: 5;
        }
        .modal-filename {
            color: #9aabbf;
            font-size: 13px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .modal-download {
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 9px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .modal-download:hover { transform: scale(1.05); box-shadow: 0 4px 28px rgba(240,147,62,0.4); }

        /* ==========================================================
           BİLDİRİM (TOAST) - ŞIK ve MODERN
           ========================================================== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            max-width: 90%;
            width: 400px;
        }
        .toast {
            pointer-events: auto;
            background: rgba(22, 30, 44, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px 22px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 280px;
            width: 100%;
            animation: toastIn 0.35s ease both;
            transition: 0.3s;
        }
        .toast.hide {
            animation: toastOut 0.35s ease both;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-10px) scale(0.96); }
        }
        .toast .icon {
            font-size: 22px;
            flex-shrink: 0;
            line-height: 1;
        }
        .toast .content {
            flex: 1;
            font-size: 14px;
            color: #e8edf5;
            font-weight: 500;
            line-height: 1.4;
        }
        .toast .content .sub {
            font-size: 12px;
            color: #6b7a93;
            font-weight: 400;
            display: block;
            margin-top: 2px;
        }
        .toast .close-btn {
            background: none;
            border: none;
            color: #4a5268;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.2s;
        }
        .toast .close-btn:hover { color: #e8edf5; }
        .toast.success { border-left: 3px solid #4cda6c; }
        .toast.error { border-left: 3px solid #f85149; }
        .toast.warning { border-left: 3px solid #f0933e; }
        .toast.info { border-left: 3px solid #58a6ff; }

        @media (max-width: 600px) {
            .app { padding: 18px; }
            .buttons { grid-template-columns: 1fr; gap: 8px; }
            .header h1 { font-size: 18px; }
            .header-badge { display: none; }
            .header-logo { height: 34px; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .gallery-item .media { height: 130px; }
            .repo-buttons { flex-direction: column; }
            .repo-btn { justify-content: center; }
            .modal-content { max-width: 98vw; }
            .modal-bottom { padding: 6px 12px 6px 16px; gap: 10px; flex-wrap: wrap; justify-content: center; bottom: 14px; }
            .modal-filename { max-width: 80px; font-size: 12px; }
            .modal-download { padding: 6px 16px; font-size: 12px; }
            .modal-close { width: 34px; height: 34px; font-size: 18px; top: 10px; right: 12px; }
            .gallery-header { flex-direction: column; align-items: stretch; }
            .gallery-header .left { justify-content: center; flex-wrap: wrap; }
            .gallery-stats { font-size: 11px; gap: 10px; flex-wrap: wrap; justify-content: center; }
            .toast-container { width: 95%; bottom: 16px; }
            .toast { padding: 12px 16px; min-width: unset; }
            .toast .content { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <img class="header-logo" src="https://i.postimg.cc/tCYfpbZy/be371099-de3c-430e-b3de-37d5dbd175fa.png" alt="Logo">
                <h1>📸 Gallery Cloud</h1>
            </div>
            <span class="header-badge">✦ Premium</span>
        </div>

        <!-- TOKEN -->
        <div class="input-grid">
            <div class="input-group">
                <label>🔑 Token</label>
                <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
        </div>

        <!-- REPO BUTONLARI -->
        <div class="repo-buttons" id="repoButtons"></div>

        <!-- DURUM -->
        <div class="status" id="status">
            <span class="spinner"></span>
            <span class="msg">✨ Hazır</span>
        </div>

        <!-- DOSYA ALANI -->
        <div class="file-area" id="fileArea">
            <span class="icon">
                <img src="https://i.postimg.cc/TY1HR0Dk/e625067c-560b-4f86-a39c-725239da40f1-(1)(3).png" alt="Dosya" style="width:40px;height:40px;display:block;margin:0 auto;">
            </span>
            <div class="text">
                <strong>Dosya seç</strong> veya buraya sürükle
            </div>
            <div class="file-count" id="fileCount">Hiç dosya seçilmedi</div>
            <input type="file" id="fileInput" multiple accept="image/*,video/*">
        </div>

        <!-- BUTONLAR -->
        <div class="buttons">
            <button class="btn btn-upload" id="uploadBtn">📤 Yükle</button>
            <button class="btn btn-list" id="listBtn">📋 Listele</button>
            <button class="btn btn-clear" id="clearBtn">🗑️ Temizle</button>
        </div>

        <!-- GALERİ HEADER -->
        <div class="gallery-header">
            <div class="left">
                <span>📸 Galeri</span>
                <span class="count" id="galleryCount">0 dosya</span>
                <div class="gallery-stats">
                    <span>🖼️ <span id="imageCount">0</span></span>
                    <span>🎬 <span id="videoCount">0</span></span>
                </div>
            </div>
        </div>

        <!-- GALERİ -->
        <div class="gallery" id="gallery">
            <div class="gallery-empty">
                <span style="font-size:48px;display:block;margin-bottom:8px;">📭</span>
                Henüz fotoğraf yok
            </div>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">✕</button>
            <div id="modalMedia"></div>
            <div class="modal-bottom">
                <span class="modal-filename" id="modalFilename">dosya</span>
                <button class="modal-download" id="modalDownload">⬇️ İndir</button>
            </div>
        </div>
    </div>

    <!-- BİLDİRİM KAPSAMI -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ===== REPO LİSTESİ =====
        const repolar = [
            { ad: 'benim-fotolarim', etiket: 'Ana Galeri', limit: 2000 },
            { ad: 'fotolar-2', etiket: 'Galeri 2', limit: 2000 },
            { ad: 'fotolar-3', etiket: 'Galeri 3', limit: 2000 }
        ];

        let aktifRepo = 'benim-fotolarim';
        let repoDosyaSayilari = {};
        let currentToken = '';

        // ===== DOM =====
        const tokenInput = document.getElementById('token');
        const statusEl = document.getElementById('status');
        const statusMsg = statusEl.querySelector('.msg');
        const repoButtons = document.getElementById('repoButtons');
        const fileInput = document.getElementById('fileInput');
        const fileArea = document.getElementById('fileArea');
        const fileCount = document.getElementById('fileCount');
        const galleryCount = document.getElementById('galleryCount');
        const imageCount = document.getElementById('imageCount');
        const videoCount = document.getElementById('videoCount');
        const uploadBtn = document.getElementById('uploadBtn');
        const listBtn = document.getElementById('listBtn');
        const clearBtn = document.getElementById('clearBtn');
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalMedia = document.getElementById('modalMedia');
        const modalFilename = document.getElementById('modalFilename');
        const modalClose = document.getElementById('modalClose');
        const modalDownload = document.getElementById('modalDownload');
        const toastContainer = document.getElementById('toastContainer');

        let currentModalUrl = '';
        let currentModalName = '';
        let tumDosyalar = [];

        // ==========================================================
        // BİLDİRİM (TOAST) FONKSİYONU - ŞIK ve MODERN
        // ==========================================================
        function showToast(icon, message, subMessage = '', type = 'info', duration = 4000) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="icon">${icon}</span>
                <div class="content">
                    ${message}
                    ${subMessage ? `<span class="sub">${subMessage}</span>` : ''}
                </div>
                <button class="close-btn" onclick="this.closest('.toast').remove()">✕</button>
            `;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // ===== YARDIMCI =====
        function setStatus(text, type = '') {
            statusEl.className = 'status' + (type ? ' ' + type : '');
            statusMsg.innerHTML = text;
        }

        function getConfig() {
            return {
                user: 'mm2vault',
                repo: aktifRepo,
                token: currentToken || tokenInput.value.trim() || localStorage.getItem('githubToken') || ''
            };
        }

        function validateConfig() {
            const c = getConfig();
            if (!c.token || !c.token.startsWith('ghp_')) {
                setStatus('❌ Geçerli token gerekli (ghp_ ile başlar)', 'error');
                showToast('⚠️', 'Token gerekli', 'Lütfen geçerli bir GitHub token\'ı girin.', 'error', 5000);
                return null;
            }
            return c;
        }

        function getFileList() { return Array.from(fileInput.files); }

        function updateFileCount() {
            const files = getFileList();
            fileCount.textContent = files.length === 0 ? 'Hiç dosya seçilmedi' : `${files.length} dosya seçildi`;
        }

        fileInput.addEventListener('change', updateFileCount);

        // ===== DRAG & DROP =====
        fileArea.addEventListener('dragover', e => {
            e.preventDefault();
            fileArea.classList.add('dragover');
        });
        fileArea.addEventListener('dragleave', () => fileArea.classList.remove('dragover'));
        fileArea.addEventListener('drop', e => {
            e.preventDefault();
            fileArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileCount();
            }
        });

        // ===== REPO DOSYA SAYISINI ÇEK =====
        async function getRepoFileCount(repoAdi) {
            const cfg = getConfig();
            if (!cfg.token) return 0;
            try {
                const url = `https://api.github.com/repos/${cfg.user}/${repoAdi}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (!res.ok) return 0;
                const data = await res.json();
                return data.length || 0;
            } catch { return 0; }
        }

        // ===== REPO BUTONLARI =====
        async function renderRepoButtons() {
            repoButtons.innerHTML = '';
            const cfg = getConfig();
            if (!cfg.token) {
                repoButtons.innerHTML = '<span style="color:#6b7a93;font-size:13px;">⚠️ Token girin</span>';
                return;
            }
            for (const repo of repolar) {
                const dosyaSayisi = await getRepoFileCount(repo.ad);
                repoDosyaSayilari[repo.ad] = dosyaSayisi;
                const oran = Math.min((dosyaSayisi / repo.limit) * 100, 100);
                const btn = document.createElement('button');
                btn.className = `repo-btn ${repo.ad === aktifRepo ? 'active' : ''}`;
                let durumClass = 'bos';
                let durumText = '🟢 Boş';
                if (oran >= 90) { durumClass = 'dolu'; durumText = '🔴 Dolu'; }
                else if (oran >= 50) { durumClass = 'yari'; durumText = '🟡 Yarı Dolu'; }
                btn.innerHTML = `
                    <span>📁 ${repo.etiket}</span>
                    <span class="doluluk ${durumClass}">${Math.round(oran)}%</span>
                    <span class="dosya-sayisi">(${dosyaSayisi} dosya)</span>
                `;
                btn.addEventListener('click', () => {
                    aktifRepo = repo.ad;
                    renderRepoButtons();
                    listFiles();
                    showToast('📂', `Repo değiştirildi`, `${repo.etiket} açıldı`, 'info', 2500);
                });
                repoButtons.appendChild(btn);
            }
        }

        // ===== YÜKLEME =====
        async function uploadFiles() {
            const cfg = validateConfig();
            if (!cfg) return;
            const files = getFileList();
            if (!files.length) {
                setStatus('⚠️ Lütfen dosya seç', 'error');
                showToast('⚠️', 'Dosya seçilmedi', 'Lütfen en az bir dosya seçin.', 'warning', 3000);
                return;
            }
            uploadBtn.disabled = true;
            let success = 0, failed = 0;
            for (const file of files) {
                setStatus(`⏳ ${file.name} (${success + failed + 1}/${files.length})`, 'loading');
                try {
                    const base64 = await toBase64(file);
                    const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(file.name)}`;
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Yükle: ${file.name}`,
                            content: base64
                        })
                    });
                    if (res.ok) success++;
                    else {
                        const err = await res.json();
                        if (err.message && err.message.includes('already exists')) {
                            setStatus(`⚠️ "${file.name}" zaten var`, 'error');
                            showToast('⚠️', `${file.name} zaten var`, 'Aynı isimli dosya mevcut.', 'warning', 3000);
                        }
                        failed++;
                    }
                } catch { failed++; }
            }
            uploadBtn.disabled = false;
            if (failed === 0 && success > 0) {
                setStatus(`✅ ${success} dosya yüklendi`, 'success');
                showToast('✅', `${success} dosya yüklendi`, 'Galeri yenileniyor...', 'success', 3000);
                fileInput.value = '';
                updateFileCount();
                setTimeout(() => {
                    renderRepoButtons();
                    listFiles();
                }, 2500);
            } else if (success > 0) {
                setStatus(`⚠️ ${success} başarılı, ${failed} hata`, 'error');
                showToast('⚠️', `${success} başarılı, ${failed} hata`, 'Bazı dosyalar yüklenemedi.', 'warning', 4000);
                setTimeout(() => {
                    renderRepoButtons();
                    listFiles();
                }, 2500);
            } else {
                setStatus('❌ Hiçbir dosya yüklenemedi', 'error');
                showToast('❌', 'Yükleme başarısız', 'Hiçbir dosya yüklenemedi.', 'error', 4000);
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        uploadBtn.addEventListener('click', uploadFiles);

        // ===== LİSTELEME =====
        async function listFiles() {
            const cfg = validateConfig();
            if (!cfg) return;
            setStatus('⏳ Yükleniyor...', 'loading');
            gallery.innerHTML = '';
            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (res.status === 404) {
                    setStatus('📭 Klasör boş', '');
                    gallery.innerHTML = `<div class="gallery-empty"><span style="font-size:48px;display:block;margin-bottom:8px;">📭</span>Henüz fotoğraf yok</div>`;
                    galleryCount.textContent = '0 dosya';
                    imageCount.textContent = '0';
                    videoCount.textContent = '0';
                    tumDosyalar = [];
                    return;
                }
                if (!res.ok) {
                    const err = await res.json();
                    setStatus(`❌ ${err.message || 'Hata'}`, 'error');
                    showToast('❌', 'Listeleme hatası', err.message || 'Dosyalar alınamadı.', 'error', 4000);
                    return;
                }
                const data = await res.json();
                if (!data || !data.length) {
                    setStatus('📭 Boş', '');
                    gallery.innerHTML = `<div class="gallery-empty"><span style="font-size:48px;display:block;margin-bottom:8px;">📭</span>Henüz fotoğraf yok</div>`;
                    galleryCount.textContent = '0 dosya';
                    imageCount.textContent = '0';
                    videoCount.textContent = '0';
                    tumDosyalar = [];
                    return;
                }
                tumDosyalar = data;
                let imgSay = 0, vidSay = 0;
                data.forEach(item => {
                    if (/\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name)) vidSay++;
                    else if (/\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name)) imgSay++;
                });
                imageCount.textContent = imgSay;
                videoCount.textContent = vidSay;
                setStatus(`📸 ${data.length} dosya bulundu`, 'success');
                galleryCount.textContent = `${data.length} dosya`;
                const fragment = document.createDocumentFragment();
                data.sort((a, b) => a.name.localeCompare(b.name)).reverse();
                for (const item of data) {
                    const rawUrl = `https://raw.githubusercontent.com/${cfg.user}/${cfg.repo}/main/fotolar/${encodeURIComponent(item.name)}`;
                    const isVideo = /\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name);
                    const isImage = /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name);
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    let mediaHtml = '';
                    if (isVideo) {
                        mediaHtml = `<div class="media" onclick="openModal('${rawUrl}','${item.name}',true)"><video src="${rawUrl}" preload="metadata" playsinline muted></video></div>`;
                    } else if (isImage) {
                        mediaHtml = `<div class="media" onclick="openModal('${rawUrl}','${item.name}',false)"><img src="${rawUrl}" loading="lazy" onerror="this.parentElement.innerHTML='<span style=color:#4a5268;font-size:20px;>⚠️</span>'"></div>`;
                    } else {
                        mediaHtml = `<div class="media" style="color:#4a5268;font-size:13px;text-align:center;padding:10px;">📄 ${item.name}</div>`;
                    }
                    div.innerHTML = `
                        ${mediaHtml}
                        <div class="info">
                            <span class="name" title="${item.name}">${item.name}</span>
                            <div class="actions">
                                <button class="download-btn" onclick="downloadFile('${rawUrl}','${item.name}')">⬇️ İndir</button>
                                <button class="delete-btn" onclick="deleteFile('${item.name}','${item.sha}')">🗑️</button>
                            </div>
                        </div>
                    `;
                    fragment.appendChild(div);
                }
                gallery.appendChild(fragment);
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
                showToast('❌', 'Hata', e.message, 'error', 4000);
            }
        }
        listBtn.addEventListener('click', listFiles);

        // ===== MODAL =====
        function openModal(url, name, isVideo) {
            currentModalUrl = url; currentModalName = name;
            modalFilename.textContent = name;
            modal.classList.add('active');
            if (isVideo) {
                modalMedia.innerHTML = `<video src="${url}" controls autoplay style="max-width:94vw;max-height:85vh;border-radius:16px;background:#000;"></video>`;
            } else {
                modalMedia.innerHTML = `<img src="${url}" alt="Fotoğraf" style="max-width:94vw;max-height:85vh;border-radius:16px;">`;
            }
        }
        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
            modalMedia.innerHTML = '';
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                modalMedia.innerHTML = '';
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modal.classList.remove('active');
                modalMedia.innerHTML = '';
            }
        });

        // ===== İNDİRME (DÜZELTİLDİ) =====
        function downloadFile(url, filename) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Dosya alınamadı');
                    return response.blob();
                })
                .then(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                })
                .catch(() => {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                });
        }
        modalDownload.addEventListener('click', () => {
            if (currentModalUrl) downloadFile(currentModalUrl, currentModalName);
        });

        // ===== SİLME (DÜZELTİLDİ - BİLDİRİMLİ) =====
        async function deleteFile(filename, sha) {
            if (!confirm(`"${filename}" kalıcı olarak silinsin mi?`)) return;
            const cfg = getConfig();
            if (!cfg.token) {
                showToast('⚠️', 'Token gerekli', 'Lütfen token girin.', 'error', 3000);
                return;
            }
            setStatus(`⏳ Siliniyor: ${filename}`, 'loading');
            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(filename)}`;
                const res = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: `Sil: ${filename}`, sha: sha })
                });
                if (res.ok) {
                    setStatus(`🗑️ "${filename}" silindi`, 'success');
                    showToast('🗑️', `"${filename}" silindi`, 'Dosya başarıyla kaldırıldı.', 'success', 3000);
                    // GitHub'ın CDN'yi güncellemesi için 2 saniye bekle, sonra yenile
                    setTimeout(() => {
                        renderRepoButtons();
                        listFiles();
                    }, 2000);
                } else {
                    const err = await res.json();
                    setStatus(`❌ Silinemedi: ${err.message || 'Hata'}`, 'error');
                    showToast('❌', 'Silme başarısız', err.message || 'Dosya silinemedi.', 'error', 4000);
                }
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
                showToast('❌', 'Hata', e.message, 'error', 4000);
            }
        }

        // ===== TÜMÜNÜ TEMİZLE =====
        async function clearAll() {
            const cfg = getConfig();
            if (!cfg.token) {
                showToast('⚠️', 'Token gerekli', 'Lütfen token girin.', 'error', 3000);
                return;
            }
            if (!confirm('⚠️ TÜM dosyalar silinecek! Devam et?')) return;
            setStatus('⏳ Temizleniyor...', 'loading');
            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (!res.ok) { setStatus('❌ Liste alınamadı', 'error');
                    showToast('❌', 'Liste alınamadı', 'Dosyalar listelenemedi.', 'error', 4000); return; }
                const data = await res.json();
                if (!data.length) { setStatus('📭 Zaten boş', '');
                    showToast('📭', 'Zaten boş', 'Silinecek dosya yok.', 'info', 2500); return; }
                let deleted = 0;
                for (const item of data) {
                    const del = await fetch(`${url}/${encodeURIComponent(item.name)}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: `Toplu sil`, sha: item.sha })
                    });
                    if (del.ok) deleted++;
                }
                setStatus(`🗑️ ${deleted} dosya silindi`, 'success');
                showToast('🗑️', `${deleted} dosya silindi`, 'Tüm dosyalar temizlendi.', 'success', 3000);
                setTimeout(() => {
                    renderRepoButtons();
                    listFiles();
                }, 2000);
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
                showToast('❌', 'Hata', e.message, 'error', 4000);
            }
        }
        clearBtn.addEventListener('click', clearAll);

        // ===== TOKEN HATIRLAMA =====
        tokenInput.addEventListener('change', () => {
            const token = tokenInput.value.trim();
            if (token && token.startsWith('ghp_')) {
                localStorage.setItem('githubToken', token);
                currentToken = token;
                renderRepoButtons();
                listFiles();
                showToast('🔑', 'Token kaydedildi', 'Artık otomatik kullanılacak.', 'success', 2500);
            }
        });

        // ===== BAŞLANGIÇ =====
        const kayitliToken = localStorage.getItem('githubToken');
        if (kayitliToken && kayitliToken.startsWith('ghp_')) {
            currentToken = kayitliToken;
            tokenInput.value = kayitliToken;
            renderRepoButtons();
            listFiles();
            setStatus('✨ Premium sürüm hazır', 'success');
            showToast('👋', 'Hoş geldin!', 'Gallery Cloud hazır.', 'info', 2000);
        } else {
            setStatus('🔑 Token girin ve "Listele" butonuna tıklayın', '');
            showToast('🔑', 'Token gerekli', 'Lütfen GitHub token\'ınızı girin.', 'info', 4000);
        }

        tokenInput.addEventListener('change', () => {
            const token = tokenInput.value.trim();
            if (token && token.startsWith('ghp_')) {
                localStorage.setItem('githubToken', token);
                currentToken = token;
                renderRepoButtons();
                listFiles();
            }
        });
    </script>

</body>
