<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📸 Gallery Cloud</title>
    <style>
        /* ============================================
                   RESET & BASE
                ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-image: radial-gradient(ellipse at 50% 0%, #1a2332 0%, #0b0e14 70%);
            line-height: 1.5;
        }

        /* ============================================
                   ANA KART
                ============================================ */
        .app {
            max-width: 920px;
            width: 100%;
            background: rgba(18, 26, 38, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 28px 28px 32px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }

        /* ============================================
                   HEADER
                ============================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #f0933e, #e67e22);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(240, 147, 62, 0.25);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #f0e6d0, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: #8892a8;
            letter-spacing: 0.4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }

        /* ============================================
                   GİRİŞ ALANLARI
                ============================================ */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 10px;
            font-weight: 600;
            color: #6b7a93;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 14px;
            color: #e8edf5;
            outline: none;
            transition: 0.25s;
            font-family: inherit;
            width: 100%;
        }

        .input-group input:focus {
            border-color: #f0933e;
            box-shadow: 0 0 0 4px rgba(240, 147, 62, 0.08);
            background: rgba(255, 255, 255, 0.06);
        }

        .input-group input::placeholder {
            color: #3e485a;
        }

        /* ============================================
                   DURUM
                ============================================ */
        .status {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 18px;
            margin: 14px 0 18px;
            font-size: 13px;
            color: #7a879f;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
        }

        .status .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: #f0933e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
            flex-shrink: 0;
        }

        .status.loading .spinner {
            display: block;
        }
        .status.success {
            border-color: rgba(46, 160, 67, 0.2);
            color: #4cda6c;
        }
        .status.error {
            border-color: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================
                   DOSYA ALANI
                ============================================ */
        .file-area {
            border: 2px dashed rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 36px 20px 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.01);
            margin-bottom: 18px;
            position: relative;
        }

        .file-area:hover {
            border-color: rgba(240, 147, 62, 0.3);
            background: rgba(255, 255, 255, 0.03);
        }

        .file-area.dragover {
            border-color: #f0933e;
            background: rgba(240, 147, 62, 0.05);
        }

        .file-area .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .file-area .text {
            font-size: 15px;
            color: #7a879f;
        }

        .file-area .text strong {
            color: #e8edf5;
            font-weight: 500;
        }

        .file-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-area .file-count {
            display: inline-block;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: #5a687e;
        }

        /* ============================================
                   BUTONLAR
                ============================================ */
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 0.7fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-upload {
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            box-shadow: 0 4px 20px rgba(240, 147, 62, 0.2);
        }

        .btn-upload:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(240, 147, 62, 0.3);
        }

        .btn-upload:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-list {
            background: rgba(255, 255, 255, 0.05);
            color: #e8edf5;
        }

        .btn-list:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-clear {
            background: rgba(248, 81, 73, 0.08);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.1);
        }

        .btn-clear:hover {
            background: rgba(248, 81, 73, 0.16);
            transform: translateY(-2px);
        }

        /* ============================================
                   GALERİ HEADER
                ============================================ */
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 2px;
        }

        .gallery-header span {
            font-size: 13px;
            color: #6b7a93;
            font-weight: 500;
        }

        .gallery-header .count {
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* ============================================
                   GALERİ
                ============================================ */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding-top: 2px;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #3e485a;
            padding: 48px 0 32px;
            font-size: 15px;
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
        }

        .gallery-item:hover {
            border-color: rgba(240, 147, 62, 0.25);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .gallery-item .media {
            width: 100%;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e14;
            overflow: hidden;
            position: relative;
        }

        .gallery-item .media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .gallery-item:hover .media img {
            transform: scale(1.03);
        }

        .gallery-item .media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .media .play-icon {
            position: absolute;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .gallery-item .info {
            padding: 10px 14px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .gallery-item .info .name {
            font-size: 12px;
            color: #6b7a93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .gallery-item .info .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .gallery-item .info .actions button {
            background: none;
            border: none;
            color: #4a5268;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 8px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
        }

        .gallery-item .info .actions .download-btn {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #b8c4d4;
            font-weight: 500;
            gap: 4px;
        }

        .gallery-item .info .actions .download-btn:hover {
            background: #f0933e;
            color: #fff;
        }

        .gallery-item .info .actions .delete-btn:hover {
            color: #f85149;
            background: rgba(248, 81, 73, 0.08);
        }

        /* ============================================
                   MODAL
                ============================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.25s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content {
            max-width: 94vw;
            max-height: 90vh;
            border-radius: 20px;
            position: relative;
            background: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .modal-content img,
        .modal-content video {
            max-width: 94vw;
            max-height: 82vh;
            display: block;
            object-fit: contain;
            border-radius: 16px;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            font-size: 22px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.25s;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: rotate(90deg) scale(1.05);
        }

        .modal-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 16px 8px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 90%;
        }

        .modal-filename {
            color: #7a879f;
            font-size: 13px;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-download {
            background: linear-gradient(135deg, #f0933e, #e67e22);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 8px 22px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            white-space: nowrap;
        }

        .modal-download:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(240, 147, 62, 0.35);
        }

        /* ============================================
                   RESPONSIVE
                ============================================ */
        @media (max-width: 768px) {
            .app {
                padding: 18px 14px 22px;
                border-radius: 24px;
            }
            .input-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .buttons {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header-badge {
                display: none;
            }
            .header-logo {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .gallery-item .media {
                height: 130px;
            }
            .modal-content {
                max-width: 98vw;
            }
            .modal-bottom {
                padding: 6px 12px 6px 16px;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                bottom: 14px;
            }
            .modal-filename {
                max-width: 90px;
                font-size: 12px;
            }
            .modal-download {
                padding: 6px 16px;
                font-size: 12px;
            }
            .modal-close {
                width: 34px;
                height: 34px;
                font-size: 18px;
                top: 10px;
                right: 12px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .input-grid {
                grid-template-columns: 1fr 1fr;
            }
            .buttons {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ============================================
                   SCROLL BAR
                ============================================ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-left">
                <div class="header-logo">📸</div>
                <h1>Gallery Cloud</h1>
            </div>
            <span class="header-badge">✦ Premium</span>
        </div>

        <!-- ===== GİRİŞ ===== -->
        <div class="input-grid">
            <div class="input-group">
                <label>👤 Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="kullaniciadin">
            </div>
            <div class="input-group">
                <label>📁 Repo Adı</label>
                <input type="text" id="repo" placeholder="repo-adi">
            </div>
            <div class="input-group">
                <label>🔑 Token</label>
                <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
        </div>

        <!-- ===== DURUM ===== -->
        <div class="status" id="status">
            <span class="spinner"></span>
            <span class="msg">✨ Hazır</span>
        </div>

        <!-- ===== DOSYA ALANI ===== -->
        <div class="file-area" id="fileArea">
            <span class="icon">🖼️</span>
            <div class="text">
                <strong>Dosya seç</strong> veya buraya sürükle
            </div>
            <div class="file-count" id="fileCount">Hiç dosya seçilmedi</div>
            <input type="file" id="fileInput" multiple accept="image/*,video/*">
        </div>

        <!-- ===== BUTONLAR ===== -->
        <div class="buttons">
            <button class="btn btn-upload" id="uploadBtn">📤 Yükle</button>
            <button class="btn btn-list" id="listBtn">📋 Listele</button>
            <button class="btn btn-clear" id="clearBtn">🗑️ Temizle</button>
        </div>

        <!-- ===== GALERİ HEADER ===== -->
        <div class="gallery-header">
            <span>📸 Galeri</span>
            <span class="count" id="galleryCount">0 dosya</span>
        </div>

        <!-- ===== GALERİ ===== -->
        <div class="gallery" id="gallery">
            <div class="gallery-empty">📭 Henüz fotoğraf yok</div>
        </div>

    </div>

    <!-- ==========================================
    MODAL
    ========================================== -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">✕</button>
            <div id="modalMedia"></div>
            <div class="modal-bottom">
                <span class="modal-filename" id="modalFilename">dosya</span>
                <button class="modal-download" id="modalDownload">⬇️ İndir</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DOM REFERANSLARI
        // ============================================
        const username = document.getElementById('username');
        const repo = document.getElementById('repo');
        const token = document.getElementById('token');
        const statusEl = document.getElementById('status');
        const statusMsg = statusEl.querySelector('.msg');
        const fileInput = document.getElementById('fileInput');
        const fileArea = document.getElementById('fileArea');
        const fileCount = document.getElementById('fileCount');
        const galleryCount = document.getElementById('galleryCount');
        const uploadBtn = document.getElementById('uploadBtn');
        const listBtn = document.getElementById('listBtn');
        const clearBtn = document.getElementById('clearBtn');
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalMedia = document.getElementById('modalMedia');
        const modalFilename = document.getElementById('modalFilename');
        const modalClose = document.getElementById('modalClose');
        const modalDownload = document.getElementById('modalDownload');
        let currentModalUrl = '';
        let currentModalName = '';

        // ============================================
        // YARDIMCI FONKSİYONLAR
        // ============================================
        function setStatus(text, type = '') {
            statusEl.className = 'status' + (type ? ' ' + type : '');
            statusMsg.textContent = text;
        }

        function getConfig() {
            return {
                user: username.value.trim(),
                repo: repo.value.trim(),
                token: token.value.trim()
            };
        }

        function validateConfig() {
            const c = getConfig();
            if (!c.user) { setStatus('❌ Kullanıcı adı gerekli', 'error'); return null; }
            if (!c.repo) { setStatus('❌ Repo adı gerekli', 'error'); return null; }
            if (!c.token || !c.token.startsWith('ghp_')) { setStatus('❌ Geçerli token gerekli', 'error'); return null; }
            return c;
        }

        function getFileList() { return Array.from(fileInput.files); }

        function updateFileCount() {
            const files = getFileList();
            fileCount.textContent = files.length === 0 ? 'Hiç dosya seçilmedi' : `${files.length} dosya seçildi`;
        }

        fileInput.addEventListener('change', updateFileCount);

        // ============================================
        // DRAG & DROP
        // ============================================
        fileArea.addEventListener('dragover', e => {
            e.preventDefault();
            fileArea.classList.add('dragover');
        });
        fileArea.addEventListener('dragleave', () => fileArea.classList.remove('dragover'));
        fileArea.addEventListener('drop', e => {
            e.preventDefault();
            fileArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileCount();
            }
        });

        // ============================================
        // YÜKLEME
        // ============================================
        async function uploadFiles() {
            const cfg = validateConfig();
            if (!cfg) return;
            const files = getFileList();
            if (!files.length) { setStatus('⚠️ Lütfen dosya seç', 'error'); return; }

            uploadBtn.disabled = true;
            let success = 0,
                failed = 0;

            for (const file of files) {
                setStatus(`⏳ ${file.name} (${success + failed + 1}/${files.length})`, 'loading');
                try {
                    const base64 = await toBase64(file);
                    const url =
                        `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(file.name)}`;
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Yükle: ${file.name}`,
                            content: base64
                        })
                    });
                    if (res.ok) {
                        success++;
                    } else {
                        const err = await res.json();
                        if (err.message && err.message.includes('already exists')) {
                            setStatus(`⚠️ "${file.name}" zaten var`, 'error');
                        }
                        failed++;
                    }
                } catch {
                    failed++;
                }
            }

            uploadBtn.disabled = false;
            if (failed === 0 && success > 0) {
                setStatus(`✅ ${success} dosya yüklendi ✨`, 'success');
                fileInput.value = '';
                updateFileCount();
                listFiles();
            } else if (success > 0) {
                setStatus(`⚠️ ${success} başarılı, ${failed} hata`, 'error');
            } else {
                setStatus('❌ Hiçbir dosya yüklenemedi', 'error');
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        uploadBtn.addEventListener('click', uploadFiles);

        // ============================================
        // LİSTELEME
        // ============================================
        async function listFiles() {
            const cfg = validateConfig();
            if (!cfg) return;

            setStatus('⏳ Yükleniyor...', 'loading');
            gallery.innerHTML = '';

            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });

                if (res.status === 404) {
                    setStatus('📭 "fotolar" klasörü boş', '');
                    gallery.innerHTML = '<div class="gallery-empty">📭 Henüz fotoğraf yok</div>';
                    galleryCount.textContent = '0 dosya';
                    return;
                }
                if (!res.ok) {
                    const err = await res.json();
                    setStatus(`❌ ${err.message || 'Hata'}`, 'error');
                    return;
                }

                const data = await res.json();
                if (!data || !data.length) {
                    setStatus('📭 Boş', '');
                    gallery.innerHTML = '<div class="gallery-empty">📭 Henüz fotoğraf yok</div>';
                    galleryCount.textContent = '0 dosya';
                    return;
                }

                setStatus(`📸 ${data.length} dosya bulundu`, 'success');
                galleryCount.textContent = `${data.length} dosya`;
                data.sort((a, b) => a.name.localeCompare(b.name)).reverse();

                for (const item of data) {
                    const rawUrl =
                        `https://raw.githubusercontent.com/${cfg.user}/${cfg.repo}/main/fotolar/${encodeURIComponent(item.name)}`;
                    const isVideo = /\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name);
                    const isImage = /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name);

                    const div = document.createElement('div');
                    div.className = 'gallery-item';

                    let mediaHtml = '';
                    if (isVideo) {
                        mediaHtml = `
                                    <div class="media" onclick="openModal('${rawUrl}','${item.name}',true)">
                                        <video src="${rawUrl}" muted></video>
                                        <span class="play-icon">▶️</span>
                                    </div>
                                `;
                    } else if (isImage) {
                        mediaHtml = `
                                    <div class="media" onclick="openModal('${rawUrl}','${item.name}',false)">
                                        <img src="${rawUrl}" loading="lazy" 
                                             onerror="this.parentElement.innerHTML='<span style=color:#4a5268;font-size:20px;>⚠️</span>'">
                                    </div>
                                `;
                    } else {
                        mediaHtml =
                            `<div class="media" style="color:#4a5268;font-size:13px;text-align:center;padding:10px;">📄 ${item.name}</div>`;
                    }

                    div.innerHTML = `
                                ${mediaHtml}
                                <div class="info">
                                    <span class="name" title="${item.name}">${item.name}</span>
                                    <div class="actions">
                                        <button class="download-btn" onclick="downloadFile('${rawUrl}','${item.name}')">⬇️</button>
                                        <button class="delete-btn" onclick="deleteFile('${item.name}')">🗑️</button>
                                    </div>
                                </div>
                            `;
                    gallery.appendChild(div);
                }
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
            }
        }

        listBtn.addEventListener('click', listFiles);

        // ============================================
        // MODAL
        // ============================================
        function openModal(url, name, isVideo) {
            currentModalUrl = url;
            currentModalName = name;
            modalFilename.textContent = name;
            modal.classList.add('active');
            modalMedia.innerHTML = isVideo ?
                `<video src="${url}" controls autoplay></video>` :
                `<img src="${url}" alt="Fotoğraf">`;
        }

        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
            modalMedia.innerHTML = '';
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                modalMedia.innerHTML = '';
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modal.classList.remove('active');
                modalMedia.innerHTML = '';
            }
        });

        // ============================================
        // İNDİRME
        // ============================================
        function downloadFile(url, filename) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Dosya alınamadı');
                    return response.blob();
                })
                .then(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
                })
                .catch(() => {
                    // Fallback
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                });
        }

        modalDownload.addEventListener('click', () => {
            if (currentModalUrl) downloadFile(currentModalUrl, currentModalName);
        });

        // ============================================
        // SİLME
        // ============================================
        async function deleteFile(filename) {
            if (!confirm(`"${filename}" kalıcı olarak silinsin mi?`)) return;
            const cfg = getConfig();
            if (!cfg.user || !cfg.repo || !cfg.token) {
                setStatus('❌ Önce bilgileri gir', 'error');
                return;
            }

            setStatus(`⏳ Siliniyor: ${filename}`, 'loading');
            try {
                const infoUrl =
                    `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(filename)}`;
                const infoRes = await fetch(infoUrl, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (!infoRes.ok) { setStatus('❌ Dosya bulunamadı', 'error'); return; }
                const info = await infoRes.json();

                const delRes = await fetch(infoUrl, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Sil: ${filename}`,
                        sha: info.sha
                    })
                });
                if (delRes.ok) {
                    setStatus(`🗑️ "${filename}" silindi`, 'success');
                    listFiles();
                } else {
                    setStatus('❌ Silinemedi', 'error');
                }
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
            }
        }

        // ============================================
        // TÜMÜNÜ TEMİZLE
        // ============================================
        async function clearAll() {
            const cfg = getConfig();
            if (!cfg.user || !cfg.repo || !cfg.token) {
                setStatus('❌ Önce bilgileri gir', 'error');
                return;
            }
            if (!confirm('⚠️ TÜM dosyalar silinecek! Devam et?')) return;

            setStatus('⏳ Temizleniyor...', 'loading');
            try {
                const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (!res.ok) { setStatus('❌ Liste alınamadı', 'error'); return; }
                const data = await res.json();
                if (!data.length) { setStatus('📭 Zaten boş', ''); return; }

                let deleted = 0;
                for (const item of data) {
                    const del = await fetch(`${url}/${encodeURIComponent(item.name)}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Toplu sil`,
                            sha: item.sha
                        })
                    });
                    if (del.ok) deleted++;
                }
                setStatus(`🗑️ ${deleted} dosya silindi`, 'success');
                listFiles();
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
            }
        }

        clearBtn.addEventListener('click', clearAll);

        // ============================================
        // LOCAL STORAGE (Bilgileri hatırla)
        // ============================================
        try {
            const saved = localStorage.getItem('fotoApp');
            if (saved) {
                const data = JSON.parse(saved);
                username.value = data.username || '';
                repo.value = data.repo || '';
                token.value = data.token || '';
            }
        } catch (e) {}

        [username, repo, token].forEach(el => {
            el.addEventListener('change', () => {
                try {
                    localStorage.setItem('fotoApp', JSON.stringify({
                        username: username.value,
                        repo: repo.value,
                        token: token.value
                    }));
                } catch (e) {}
            });
        });

        // ============================================
        // BAŞLANGIÇ
        // ============================================
        setStatus('✨ Premium sürüm hazır', 'success');
    </script>

</body>
