<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📸 Gallery Cloud</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/tCYfpbZy/be371099-de3c-430e-b3de-37d5dbd175fa.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(ellipse at 50% 0%, #1a2332 0%, #0b0e14 70%);
        }

        .app {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            background: rgba(18, 26, 38, 0.88);
            backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(240, 147, 62, 0.08), rgba(230, 126, 34, 0.04));
            border-radius: 20px;
            border: 1px solid rgba(240, 147, 62, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            height: 44px;
            width: auto;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0e6d0, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-badge {
            background: linear-gradient(135deg, rgba(240, 147, 62, 0.15), rgba(230, 126, 34, 0.05));
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: #f0933e;
            border: 1px solid rgba(240, 147, 62, 0.15);
        }

        .status {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #7a879f;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: #f0933e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .status.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }

        .repo-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s;
            cursor: pointer;
            animation: fadeUp 0.4s ease both;
        }

        .repo-card:hover {
            transform: translateY(-6px);
            border-color: rgba(240, 147, 62, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .repo-card .kapak {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #0b0e14;
        }

        .repo-card .info {
            padding: 16px;
        }

        .repo-card .info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .repo-card .info p {
            font-size: 13px;
            color: #6b7a93;
        }

        .repo-card .info .durum {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .durum.dolu {
            background: rgba(248, 81, 73, 0.12);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.15);
        }

        .durum.acik {
            background: rgba(46, 160, 67, 0.12);
            color: #4cda6c;
            border: 1px solid rgba(46, 160, 67, 0.15);
        }

        .durum.yari {
            background: rgba(240, 147, 62, 0.12);
            color: #f0933e;
            border: 1px solid rgba(240, 147, 62, 0.15);
        }

        .repo-aktif-badge {
            background: rgba(240, 147, 62, 0.12);
            color: #f0933e;
            border: 1px solid rgba(240, 147, 62, 0.15);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #e8edf5;
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.25s;
            font-family: inherit;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .gizli {
            display: none !important;
        }

        .repo-adu {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .repo-adu h2 {
            font-size: 18px;
            font-weight: 600;
        }

        /* ===== GALERİ İÇİ ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding-top: 2px;
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            animation: fadeUp 0.4s ease both;
        }

        .gallery-item:hover {
            border-color: rgba(240, 147, 62, 0.25);
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .gallery-item .media {
            width: 100%;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e14;
            overflow: hidden;
            position: relative;
        }

        .gallery-item .media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
            display: block;
        }

        .gallery-item:hover .media img {
            transform: scale(1.05);
        }

        .gallery-item .media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .gallery-item .info {
            padding: 10px 14px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .gallery-item .info .name {
            font-size: 12px;
            color: #6b7a93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .gallery-item .info .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .gallery-item .info .actions button,
        .gallery-item .info .actions a {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #b8c4d4;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            font-weight: 500;
        }

        .gallery-item .info .actions button:hover,
        .gallery-item .info .actions a:hover {
            background: #f0933e;
            color: #fff;
        }

        .gallery-item .info .actions .delete-btn:hover {
            background: rgba(248, 81, 73, 0.16);
            color: #f85149;
        }

        .bos-mesaj {
            text-align: center;
            color: #4a5268;
            padding: 40px 0;
        }

        .bos-mesaj span {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .app {
                padding: 18px;
            }
            .repo-grid {
                grid-template-columns: 1fr;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .gallery-item .media {
                height: 130px;
            }
            .header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            .header-left {
                flex-direction: column;
                gap: 6px;
            }
            .header-badge {
                font-size: 10px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <img class="header-logo" src="https://i.postimg.cc/tCYfpbZy/be371099-de3c-430e-b3de-37d5dbd175fa.png" alt="Logo">
                <h1>📸 Gallery Cloud</h1>
            </div>
            <span class="header-badge">✦ Repo Yöneticisi</span>
        </div>

        <!-- DURUM -->
        <div class="status" id="status">
            <span class="spinner"></span>
            <span class="msg">✨ Repolar taranıyor...</span>
        </div>

        <!-- ANA SAYFA (REPO LİSTESİ) -->
        <div id="anaSayfa">
            <div class="repo-grid" id="repoGrid"></div>
        </div>

        <!-- REPO İÇİ SAYFA (GALERİ) -->
        <div id="repoSayfa" class="gizli">
            <button class="back-btn" id="geriBtn">← Geri</button>
            <div class="repo-adu">
                <h2 id="repoBaslik">📁 Repo Adı</h2>
                <span class="durum acik" id="repoDurum">🟢 Açık</span>
                <span class="repo-aktif-badge" id="repoAktifBadge">✅ Aktif</span>
            </div>
            <div id="repoGaleri"></div>
        </div>

    </div>

    <script>
        // ============================================
        // REPO LİSTESİ (BURAYA YENİ REPO EKLE)
        // ============================================
        const repolar = [
            {
                ad: 'benim-fotolarim',
                etiket: '📸 Ana Galeri',
                kapak: 'https://i.postimg.cc/TY1HR0Dk/e625067c-560b-4f86-a39c-725239da40f1-(1)(3).png',
                limit: 2000
            },
            {
                ad: 'fotolar-2',
                etiket: '📸 Galeri 2',
                kapak: 'https://i.postimg.cc/TY1HR0Dk/e625067c-560b-4f86-a39c-725239da40f1-(1)(3).png',
                limit: 2000
            },
            {
                ad: 'fotolar-3',
                etiket: '📸 Galeri 3',
                kapak: 'https://i.postimg.cc/TY1HR0Dk/e625067c-560b-4f86-a39c-725239da40f1-(1)(3).png',
                limit: 2000
            }
        ];

        // ============================================
        // DOM
        // ============================================
        const statusEl = document.getElementById('status');
        const statusMsg = statusEl.querySelector('.msg');
        const repoGrid = document.getElementById('repoGrid');
        const anaSayfa = document.getElementById('anaSayfa');
        const repoSayfa = document.getElementById('repoSayfa');
        const repoBaslik = document.getElementById('repoBaslik');
        const repoDurum = document.getElementById('repoDurum');
        const repoAktifBadge = document.getElementById('repoAktifBadge');
        const repoGaleri = document.getElementById('repoGaleri');
        const geriBtn = document.getElementById('geriBtn');

        let aktifRepo = 'benim-fotolarim';
        let repoDosyaSayilari = {};
        let currentToken = '';

        // ============================================
        // YARDIMCI
        // ============================================
        function setStatus(text, type = '') {
            statusEl.className = 'status' + (type ? ' ' + type : '');
            statusMsg.textContent = text;
        }

        function getConfig() {
            return {
                user: 'mm2vault',
                token: currentToken || localStorage.getItem('githubToken') || ''
            };
        }

        // ============================================
        // REPO DOSYA SAYISINI ÇEK
        // ============================================
        async function getRepoFileCount(repoAdi) {
            const cfg = getConfig();
            if (!cfg.token) return 0;

            try {
                const url = `https://api.github.com/repos/${cfg.user}/${repoAdi}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (!res.ok) return 0;
                const data = await res.json();
                return data.length || 0;
            } catch {
                return 0;
            }
        }

        // ============================================
        // REPOLARI LİSTELE
        // ============================================
        async function listRepos() {
            setStatus('📡 Repolar taranıyor...', 'loading');
            repoGrid.innerHTML = '';

            const cfg = getConfig();
            if (!cfg.token) {
                setStatus('⚠️ Token gerekli! Lütfen token\'ı gir.', 'error');
                return;
            }

            let toplamDosya = 0;

            for (const repo of repolar) {
                const dosyaSayisi = await getRepoFileCount(repo.ad);
                repoDosyaSayilari[repo.ad] = dosyaSayisi;
                toplamDosya += dosyaSayisi;

                const kart = document.createElement('div');
                kart.className = 'repo-card';

                let durumClass = 'acik';
                let durumText = '🟢 Açık';
                const oran = dosyaSayisi / repo.limit;

                if (oran >= 0.9) {
                    durumClass = 'dolu';
                    durumText = '🔴 Dolu';
                } else if (oran >= 0.5) {
                    durumClass = 'yari';
                    durumText = '🟡 Yarı Dolu';
                }

                const aktif = (repo.ad === aktifRepo);

                kart.innerHTML = `
                    <img class="kapak" src="${repo.kapak}" alt="${repo.etiket}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22160%22><rect width=%22300%22 height=%22160%22 fill=%22%23161b22%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%234a5268%22 font-size=%2220%22>📸</text></svg>'">
                    <div class="info">
                        <h3>${repo.etiket} ${aktif ? '<span class="repo-aktif-badge">✅ Aktif</span>' : ''}</h3>
                        <p>📁 ${dosyaSayisi} dosya • ${Math.round(oran * 100)}% dolu</p>
                        <span class="durum ${durumClass}">${durumText}</span>
                    </div>
                `;

                kart.addEventListener('click', () => {
                    aktifRepo = repo.ad;
                    repoAc(repo.ad);
                });

                repoGrid.appendChild(kart);
            }

            setStatus(`✅ ${repolar.length} repo • ${toplamDosya} dosya`, 'success');
        }

        // ============================================
        // REPO AÇ
        // ============================================
        async function repoAc(repoAdi) {
            anaSayfa.classList.add('gizli');
            repoSayfa.classList.remove('gizli');

            const repo = repolar.find(r => r.ad === repoAdi);
            repoBaslik.textContent = `📁 ${repo ? repo.etiket : repoAdi}`;

            const dosyaSayisi = repoDosyaSayilari[repoAdi] || 0;
            const oran = dosyaSayisi / (repo ? repo.limit : 2000);

            let durumClass = 'acik';
            let durumText = '🟢 Açık';
            if (oran >= 0.9) {
                durumClass = 'dolu';
                durumText = '🔴 Dolu';
            } else if (oran >= 0.5) {
                durumClass = 'yari';
                durumText = '🟡 Yarı Dolu';
            }

            repoDurum.className = `durum ${durumClass}`;
            repoDurum.textContent = durumText;

            const aktif = (repoAdi === aktifRepo);
            repoAktifBadge.style.display = aktif ? 'inline-block' : 'none';

            await getRepoFiles(repoAdi);
        }

        // ============================================
        // REPO DOSYALARINI GETİR
        // ============================================
        async function getRepoFiles(repoAdi) {
            const cfg = getConfig();
            if (!cfg.token) {
                repoGaleri.innerHTML = '<p style="color:#f85149;">❌ Token gerekli</p>';
                return;
            }

            setStatus('⏳ Dosyalar yükleniyor...', 'loading');
            repoGaleri.innerHTML = '';

            try {
                const url = `https://api.github.com/repos/${cfg.user}/${repoAdi}/contents/fotolar`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });

                if (res.status === 404) {
                    repoGaleri.innerHTML = `
                        <div class="bos-mesaj">
                            <span>📭</span>
                            Bu repoda henüz dosya yok.
                        </div>
                    `;
                    setStatus('📭 Klasör boş', '');
                    return;
                }

                if (!res.ok) {
                    repoGaleri.innerHTML = `<p style="color:#f85149;">❌ Dosyalar alınamadı</p>`;
                    setStatus('❌ Hata', 'error');
                    return;
                }

                const data = await res.json();
                if (!data || !data.length) {
                    repoGaleri.innerHTML = `
                        <div class="bos-mesaj">
                            <span>📭</span>
                            Bu repoda henüz dosya yok.
                        </div>
                    `;
                    setStatus('📭 Boş', '');
                    return;
                }

                setStatus(`📸 ${data.length} dosya bulundu`, 'success');

                const grid = document.createElement('div');
                grid.className = 'gallery-grid';

                data.sort((a, b) => a.name.localeCompare(b.name)).reverse();

                for (const item of data) {
                    const rawUrl = `https://raw.githubusercontent.com/${cfg.user}/${repoAdi}/main/fotolar/${encodeURIComponent(item.name)}`;
                    const isVideo = /\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name);
                    const isImage = /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name);

                    const div = document.createElement('div');
                    div.className = 'gallery-item';

                    let mediaHtml = '';
                    if (isVideo) {
                        mediaHtml = `
                            <div class="media" onclick="window.open('${rawUrl}', '_blank')">
                                <video src="${rawUrl}" muted></video>
                                <span style="position:absolute;font-size:36px;color:rgba(255,255,255,0.5);pointer-events:none;">▶️</span>
                            </div>
                        `;
                    } else if (isImage) {
                        mediaHtml = `
                            <div class="media" onclick="window.open('${rawUrl}', '_blank')">
                                <img src="${rawUrl}" loading="lazy" onerror="this.parentElement.innerHTML='<span style=color:#4a5268;font-size:20px;>⚠️</span>'">
                            </div>
                        `;
                    } else {
                        mediaHtml = `
                            <div class="media" style="color:#4a5268;font-size:13px;text-align:center;padding:10px;">
                                📄 ${item.name}
                            </div>
                        `;
                    }

                    div.innerHTML = `
                        ${mediaHtml}
                        <div class="info">
                            <span class="name" title="${item.name}">${item.name}</span>
                            <div class="actions">
                                <a href="${rawUrl}" download>⬇️ İndir</a>
                                <button class="delete-btn" onclick="deleteFile('${repoAdi}','${item.name}','${item.sha}')">🗑️</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(div);
                }

                repoGaleri.appendChild(grid);

            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
                repoGaleri.innerHTML = `<p style="color:#f85149;">❌ Hata: ${e.message}</p>`;
            }
        }

        // ============================================
        // DOSYA SİL
        // ============================================
        async function deleteFile(repoAdi, filename, sha) {
            if (!confirm(`"${filename}" kalıcı olarak silinsin mi?`)) return;

            const cfg = getConfig();
            if (!cfg.token) {
                alert('❌ Token gerekli!');
                return;
            }

            setStatus(`⏳ Siliniyor: ${filename}`, 'loading');

            try {
                const url = `https://api.github.com/repos/${cfg.user}/${repoAdi}/contents/fotolar/${encodeURIComponent(filename)}`;
                const res = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Sil: ${filename}`,
                        sha: sha
                    })
                });

                if (res.ok) {
                    setStatus(`🗑️ "${filename}" silindi`, 'success');
                    await getRepoFiles(repoAdi);
                    await listRepos();
                } else {
                    const err = await res.json();
                    setStatus(`❌ Silinemedi: ${err.message || 'Hata'}`, 'error');
                }
            } catch (e) {
                setStatus(`❌ ${e.message}`, 'error');
            }
        }

        // ============================================
        // GERİ BUTONU
        // ============================================
        geriBtn.addEventListener('click', () => {
            repoSayfa.classList.add('gizli');
            anaSayfa.classList.remove('gizli');
            listRepos();
        });

        // ============================================
        // TOKEN KONTROLÜ
        // ============================================
        function tokenSor() {
            const token = prompt('🔑 GitHub Token\'ınızı girin (ghp_ ile başlar):');
            if (token && token.startsWith('ghp_')) {
                currentToken = token;
                localStorage.setItem('githubToken', token);
                listRepos();
            } else {
                setStatus('❌ Geçerli bir token gerekli!', 'error');
                setTimeout(tokenSor, 2000);
            }
        }

        // ============================================
        // BAŞLANGIÇ
        // ============================================
        const kayitliToken = localStorage.getItem('githubToken');
        if (kayitliToken && kayitliToken.startsWith('ghp_')) {
            currentToken = kayitliToken;
            listRepos();
        } else {
            tokenSor();
        }
    </script>

</body>
</html>
