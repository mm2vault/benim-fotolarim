<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📸 Fotoğraf Yedekleme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 800px;
            width: 100%;
            background: #161b22;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #21262d;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #f0883e, #f6a85b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header span {
            font-size: 28px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: #8b949e;
            letter-spacing: 0.3px;
        }

        .input-group input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            color: #e6edf3;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #f0883e;
            box-shadow: 0 0 0 3px rgba(240, 136, 62, 0.15);
        }

        .input-group input::placeholder {
            color: #484f58;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .status {
            background: #0d1117;
            border-radius: 10px;
            padding: 12px 16px;
            margin: 16px 0;
            font-size: 14px;
            color: #8b949e;
            border: 1px solid #21262d;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        .status .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #30363d;
            border-top-color: #f0883e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .status.loading .spinner {
            display: block;
        }

        .status.success {
            border-color: #2ea043;
            color: #3fb950;
        }

        .status.error {
            border-color: #f85149;
            color: #f85149;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .file-area {
            border: 2px dashed #30363d;
            border-radius: 14px;
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            background: #0d1117;
            margin-bottom: 16px;
            position: relative;
        }

        .file-area:hover {
            border-color: #f0883e;
            background: #161b22;
        }

        .file-area.dragover {
            border-color: #f0883e;
            background: #1c2333;
        }

        .file-area .icon {
            font-size: 42px;
            display: block;
            margin-bottom: 8px;
        }

        .file-area .text {
            font-size: 15px;
            color: #8b949e;
        }

        .file-area .text strong {
            color: #e6edf3;
        }

        .file-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-area .file-count {
            display: inline-block;
            margin-top: 8px;
            background: #21262d;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #8b949e;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-upload {
            background: #f0883e;
            color: #0d1117;
        }

        .btn-upload:hover {
            background: #f6a85b;
            transform: scale(1.01);
        }

        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-list {
            background: #21262d;
            color: #e6edf3;
        }

        .btn-list:hover {
            background: #30363d;
        }

        .btn-clear {
            background: transparent;
            color: #8b949e;
            border: 1px solid #30363d;
            grid-column: span 2;
        }

        .btn-clear:hover {
            border-color: #f85149;
            color: #f85149;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #21262d;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #484f58;
            padding: 48px 0;
            font-size: 15px;
        }

        .gallery-item {
            background: #0d1117;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #21262d;
            transition: 0.25s;
            cursor: pointer;
        }

        .gallery-item:hover {
            border-color: #f0883e;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .gallery-item .media {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            overflow: hidden;
            position: relative;
        }

        .gallery-item .media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .media .play-icon {
            position: absolute;
            font-size: 48px;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .gallery-item .info {
            padding: 10px 12px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .gallery-item .info .name {
            font-size: 12px;
            color: #8b949e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .gallery-item .info .actions {
            display: flex;
            gap: 6px;
        }

        .gallery-item .info .actions button {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 6px;
            border-radius: 8px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .gallery-item .info .actions .download-btn {
            background: #21262d;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #e6edf3;
            font-weight: 500;
        }

        .gallery-item .info .actions .download-btn:hover {
            background: #f0883e;
            color: #0d1117;
        }

        .gallery-item .info .actions .delete-btn:hover {
            color: #f85149;
            background: #21262d;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 16px 64px rgba(0,0,0,0.8);
            position: relative;
            background: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content img,
        .modal-content video {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 16px;
            display: block;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: -48px;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
        }

        .modal-close:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .modal-bottom {
            position: absolute;
            bottom: -64px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .modal-download {
            background: #f0883e;
            color: #0d1117;
            border: none;
            border-radius: 12px;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-download:hover {
            background: #f6a85b;
            transform: scale(1.03);
        }

        .modal-filename {
            color: #8b949e;
            font-size: 13px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 500px) {
            .app { padding: 16px; }
            .row { grid-template-columns: 1fr; }
            .buttons { grid-template-columns: 1fr; }
            .btn-clear { grid-column: span 1; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .gallery-item .media { height: 130px; }
            .modal-content { max-width: 98vw; }
            .modal-download { padding: 10px 20px; font-size: 14px; bottom: -48px; }
            .modal-filename { max-width: 120px; }
        }

        @media (min-width: 768px) {
            .gallery { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
            .gallery-item .media { height: 190px; }
        }
    </style>
</head>
<body>

<div class="app">

    <div class="header">
        <span>📸</span>
        <h1>Fotoğraf Yedekleme</h1>
    </div>

    <div class="row">
        <div class="input-group">
            <label>👤 GitHub Kullanıcı Adı</label>
            <input type="text" id="username" placeholder="kullaniciadin">
        </div>
        <div class="input-group">
            <label>📁 Repo Adı</label>
            <input type="text" id="repo" placeholder="repo-adi">
        </div>
    </div>

    <div class="input-group">
        <label>🔑 Token (ghp_ ile başlar)</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxx">
    </div>

    <div class="status" id="status">
        <span class="spinner"></span>
        <span class="msg">Hazır</span>
    </div>

    <div class="file-area" id="fileArea">
        <span class="icon">🖼️</span>
        <div class="text">
            <strong>Dosya seç</strong> veya buraya sürükle
        </div>
        <div class="file-count" id="fileCount">Hiç dosya seçilmedi</div>
        <input type="file" id="fileInput" multiple accept="image/*,video/*">
    </div>

    <div class="buttons">
        <button class="btn btn-upload" id="uploadBtn">📤 Yükle</button>
        <button class="btn btn-list" id="listBtn">📋 Listele</button>
        <button class="btn btn-clear" id="clearBtn">🗑️ Tümünü Temizle</button>
    </div>

    <div class="gallery" id="gallery">
        <div class="gallery-empty">📭 Fotoğraf yok, yüklemeye başla</div>
    </div>

</div>

<!-- ===== MODAL ===== -->
<div class="modal" id="modal">
    <div class="modal-content" id="modalContent">
        <button class="modal-close" id="modalClose">✕</button>
        <div id="modalMedia"></div>
        <div class="modal-bottom">
            <span class="modal-filename" id="modalFilename">dosya.jpg</span>
            <button class="modal-download" id="modalDownload">⬇️ İndir</button>
        </div>
    </div>
</div>

<script>
const username = document.getElementById('username');
const repo = document.getElementById('repo');
const token = document.getElementById('token');
const statusEl = document.getElementById('status');
const statusMsg = statusEl.querySelector('.msg');
const fileInput = document.getElementById('fileInput');
const fileArea = document.getElementById('fileArea');
const fileCount = document.getElementById('fileCount');
const uploadBtn = document.getElementById('uploadBtn');
const listBtn = document.getElementById('listBtn');
const clearBtn = document.getElementById('clearBtn');
const gallery = document.getElementById('gallery');
const modal = document.getElementById('modal');
const modalMedia = document.getElementById('modalMedia');
const modalFilename = document.getElementById('modalFilename');
const modalClose = document.getElementById('modalClose');
const modalDownload = document.getElementById('modalDownload');
let currentModalUrl = '';
let currentModalName = '';

function setStatus(text, type = '') {
    statusEl.className = 'status' + (type ? ' ' + type : '');
    statusMsg.textContent = text;
}

function getConfig() {
    return {
        user: username.value.trim(),
        repo: repo.value.trim(),
        token: token.value.trim()
    };
}

function validateConfig() {
    const c = getConfig();
    if (!c.user) { setStatus('❌ Kullanıcı adını gir', 'error'); return null; }
    if (!c.repo) { setStatus('❌ Repo adını gir', 'error'); return null; }
    if (!c.token || !c.token.startsWith('ghp_')) { setStatus('❌ Geçerli bir token gir (ghp_ ile başlar)', 'error'); return null; }
    return c;
}

function getFileList() {
    return Array.from(fileInput.files);
}

function updateFileCount() {
    const files = getFileList();
    fileCount.textContent = files.length === 0 ? 'Hiç dosya seçilmedi' : `${files.length} dosya seçildi`;
}

fileInput.addEventListener('change', updateFileCount);

fileArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    fileArea.classList.add('dragover');
});
fileArea.addEventListener('dragleave', () => {
    fileArea.classList.remove('dragover');
});
fileArea.addEventListener('drop', (e) => {
    e.preventDefault();
    fileArea.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        updateFileCount();
    }
});

async function uploadFiles() {
    const cfg = validateConfig();
    if (!cfg) return;

    const files = getFileList();
    if (files.length === 0) {
        setStatus('⚠️ Lütfen dosya seç', 'error');
        return;
    }

    uploadBtn.disabled = true;
    let success = 0;
    let failed = 0;

    for (const file of files) {
        setStatus(`⏳ Yükleniyor: ${file.name} (${success+failed+1}/${files.length})`, 'loading');
        
        try {
            const base64 = await toBase64(file);
            const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(file.name)}`;
            
            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Yükle: ${file.name}`,
                    content: base64
                })
            });

            if (res.ok) {
                success++;
            } else {
                const err = await res.json();
                if (err.message && err.message.includes('already exists')) {
                    setStatus(`⚠️ "${file.name}" zaten var (atlandı)`, 'error');
                    failed++;
                } else {
                    setStatus(`❌ ${file.name}: ${err.message || 'Hata'}`, 'error');
                    failed++;
                }
            }
        } catch (e) {
            setStatus(`❌ ${file.name}: ${e.message}`, 'error');
            failed++;
        }
    }

    uploadBtn.disabled = false;
    if (failed === 0 && success > 0) {
        setStatus(`✅ ${success} dosya yüklendi!`, 'success');
        fileInput.value = '';
        updateFileCount();
        listFiles();
    } else if (success > 0) {
        setStatus(`⚠️ ${success} başarılı, ${failed} hata`, 'error');
    } else {
        setStatus(`❌ Hiçbir dosya yüklenemedi`, 'error');
    }
}

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

uploadBtn.addEventListener('click', uploadFiles);

async function listFiles() {
    const cfg = validateConfig();
    if (!cfg) return;

    setStatus('⏳ Yükleniyor...', 'loading');
    gallery.innerHTML = '';

    try {
        const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
        const res = await fetch(url, {
            headers: { 'Authorization': `token ${cfg.token}` }
        });

        if (res.status === 404) {
            setStatus('📭 "fotolar" klasörü henüz oluşturulmamış', '');
            gallery.innerHTML = `<div class="gallery-empty">📭 Henüz fotoğraf yok</div>`;
            return;
        }

        if (!res.ok) {
            const err = await res.json();
            setStatus(`❌ ${err.message || 'Listeleme hatası'}`, 'error');
            return;
        }

        const data = await res.json();
        if (!data || data.length === 0) {
            setStatus('📭 Hiç fotoğraf yok', '');
            gallery.innerHTML = `<div class="gallery-empty">📭 Henüz fotoğraf yok</div>`;
            return;
        }

        setStatus(`📸 ${data.length} dosya bulundu`, 'success');
        
        data.sort((a, b) => a.name.localeCompare(b.name)).reverse();

        for (const item of data) {
            const rawUrl = `https://raw.githubusercontent.com/${cfg.user}/${cfg.repo}/main/fotolar/${encodeURIComponent(item.name)}`;
            const isVideo = /\.(mp4|webm|mov|avi|mkv|3gp)$/i.test(item.name);
            const isImage = /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/i.test(item.name);
            
            const div = document.createElement('div');
            div.className = 'gallery-item';
            
            let mediaHtml = '';
            if (isVideo) {
                mediaHtml = `
                    <div class="media" onclick="openModal('${rawUrl}', '${item.name}', true)">
                        <video src="${rawUrl}" muted></video>
                        <span class="play-icon">▶️</span>
                    </div>
                `;
            } else if (isImage) {
                mediaHtml = `
                    <div class="media" onclick="openModal('${rawUrl}', '${item.name}', false)">
                        <img src="${rawUrl}" loading="lazy" 
                             onerror="this.parentElement.innerHTML='<span style=\\'color:#484f58;font-size:24px;\\'>⚠️</span>'">
                    </div>
                `;
            } else {
                mediaHtml = `
                    <div class="media" style="color:#484f58;font-size:14px;text-align:center;padding:10px;">
                        📄 ${item.name}
                    </div>
                `;
            }

            div.innerHTML = `
                ${mediaHtml}
                <div class="info">
                    <span class="name" title="${item.name}">${item.name}</span>
                    <div class="actions">
                        <button class="download-btn" onclick="downloadFile('${rawUrl}', '${item.name}')">⬇️</button>
                        <button class="delete-btn" onclick="deleteFile('${item.name}')">🗑️</button>
                    </div>
                </div>
            `;
            gallery.appendChild(div);
        }
    } catch (e) {
        setStatus(`❌ ${e.message}`, 'error');
    }
}

listBtn.addEventListener('click', listFiles);

function openModal(url, name, isVideo) {
    currentModalUrl = url;
    currentModalName = name;
    modalFilename.textContent = name;
    modal.classList.add('active');
    
    if (isVideo) {
        modalMedia.innerHTML = `<video src="${url}" controls autoplay></video>`;
    } else {
        modalMedia.innerHTML = `<img src="${url}" alt="Fotoğraf">`;
    }
}

modalClose.addEventListener('click', () => {
    modal.classList.remove('active');
    modalMedia.innerHTML = '';
});

modal.addEventListener('click', (e) => {
    if (e.target === modal) {
        modal.classList.remove('active');
        modalMedia.innerHTML = '';
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        modal.classList.remove('active');
        modalMedia.innerHTML = '';
    }
});

function downloadFile(url, filename) {
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.target = '_blank';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

modalDownload.addEventListener('click', () => {
    if (currentModalUrl) {
        downloadFile(currentModalUrl, currentModalName);
    }
});

async function deleteFile(filename) {
    if (!confirm(`"${filename}" kalıcı olarak silinsin mi?`)) return;
    
    const cfg = getConfig();
    if (!cfg.user || !cfg.repo || !cfg.token) {
        setStatus('❌ Önce bilgileri gir', 'error');
        return;
    }

    setStatus(`⏳ Siliniyor: ${filename}`, 'loading');

    try {
        const infoUrl = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar/${encodeURIComponent(filename)}`;
        const infoRes = await fetch(infoUrl, {
            headers: { 'Authorization': `token ${cfg.token}` }
        });
        if (!infoRes.ok) {
            setStatus('❌ Dosya bulunamadı', 'error');
            return;
        }
        const info = await infoRes.json();

        const delRes = await fetch(infoUrl, {
            method: 'DELETE',
            headers: {
                'Authorization': `token ${cfg.token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: `Sil: ${filename}`,
                sha: info.sha
            })
        });

        if (delRes.ok) {
            setStatus(`🗑️ "${filename}" silindi`, 'success');
            listFiles();
        } else {
            const err = await delRes.json();
            setStatus(`❌ Silinemedi: ${err.message || 'Hata'}`, 'error');
        }
    } catch (e) {
        setStatus(`❌ ${e.message}`, 'error');
    }
}

async function clearAll() {
    const cfg = getConfig();
    if (!cfg.user || !cfg.repo || !cfg.token) {
        setStatus('❌ Önce bilgileri gir', 'error');
        return;
    }

    if (!confirm('⚠️ TÜM dosyalar silinecek! Devam et?')) return;

    setStatus('⏳ Tüm dosyalar taranıyor...', 'loading');

    try {
        const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/fotolar`;
        const res = await fetch(url, {
            headers: { 'Authorization': `token ${cfg.token}` }
        });
        if (!res.ok) {
            setStatus('❌ Liste alınamadı', 'error');
            return;
        }
        const data = await res.json();
        if (data.length === 0) {
            setStatus('📭 Zaten boş', '');
            return;
        }

        let deleted = 0;
        for (const item of data) {
            const delRes = await fetch(`${url}/${encodeURIComponent(item.name)}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Toplu sil: ${item.name}`,
                    sha: item.sha
                })
            });
            if (delRes.ok) deleted++;
        }

        setStatus(`🗑️ ${deleted} dosya silindi`, 'success');
        listFiles();
    } catch (e) {
        setStatus(`❌ ${e.message}`, 'error');
    }
}

clearBtn.addEventListener('click', clearAll);

try {
    const saved = localStorage.getItem('fotoApp');
    if (saved) {
        const data = JSON.parse(saved);
        username.value = data.username || '';
        repo.value = data.repo || '';
        token.value = data.token || '';
    }
} catch(e) {}

[username, repo, token].forEach(el => {
    el.addEventListener('change', () => {
        try {
            localStorage.setItem('fotoApp', JSON.stringify({
                username: username.value,
                repo: repo.value,
                token: token.value
            }));
        } catch(e) {}
    });
});

setStatus('✅ Hazır, fotoğraf yüklemeye başla!', 'success');
</script>

</body>
</html>
